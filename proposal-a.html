/* Shared pieces for all three mockups: modal, toast, printouts, device art. */
:root {
  --font: -apple-system, "Segoe UI", "Microsoft JhengHei", "微軟正黑體", "PingFang HK", "Noto Sans TC", Arial, sans-serif;

}
* { box-sizing: border-box; }

/* Modal */
.pm-overlay { position: fixed; inset: 0; background: rgba(15, 18, 25, .45); display: flex; align-items: flex-start; justify-content: center; z-index: 1000; padding: 48px 16px; overflow: auto; animation: pm-fade .12s ease-out; }
.pm-modal { background: #fff; color: #18181b; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.25); width: 100%; max-width: 560px; font-family: var(--font); font-size: 14px; }
.pm-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #ececf0; font-weight: 600; font-size: 16px; }
.pm-modal-head button { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: #71717a; }
.pm-modal-body { padding: 20px; }
.pm-modal-foot { padding: 14px 20px; border-top: 1px solid #ececf0; display: flex; gap: 8px; justify-content: flex-end; }
@keyframes pm-fade { from { opacity: 0; } to { opacity: 1; } }
.pm-btn { font: 14px var(--font); padding: 8px 14px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; color: #18181b; cursor: pointer; }
.pm-btn:hover { background: #f4f4f5; }
.pm-btn.primary { background: #18181b; border-color: #18181b; color: #fff; }
.pm-btn.primary:hover { background: #27272a; }

/* Toast */
.pm-toasts { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 2000; pointer-events: none; }
.pm-toast { background: #18181b; color: #fafafa; font: 14px var(--font); padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: pm-up .18s ease-out; }
@keyframes pm-up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Printouts: 80 mm thermal paper and a 50 x 30 mm label */
.paper-stage { background: #e9e9ee; border-radius: 10px; padding: 24px; display: flex; justify-content: center; }
.receipt { width: 302px; background: #fff; color: #111; font: 12px/1.45 var(--mono); padding: 16px 14px 22px; box-shadow: 0 2px 10px rgba(0,0,0,.12); position: relative; }
.receipt::after { content: ''; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 33%, #fff 33%, #fff 66%, transparent 66%) 0 0 / 12px 8px, linear-gradient(45deg, transparent 33%, #fff 33%, #fff 66%, transparent 66%) 0 0 / 12px 8px; }
.receipt .c { text-align: center; }
.receipt .big { font-size: 16px; font-weight: 700; font-family: var(--font); }
.receipt .rule { border-top: 1px dashed #777; margin: 8px 0; }
.receipt .row { display: flex; justify-content: space-between; gap: 8px; }
.receipt .muted { color: #555; }
.receipt .tot { font-size: 15px; font-weight: 700; }
.receipt .qr { width: 96px; height: 96px; margin: 8px auto 0; }
.receipt .sig { height: 54px; border-bottom: 1px solid #333; margin-top: 6px; display: flex; align-items: flex-end; }
.receipt .sig img { max-height: 52px; }
.receipt .small { font-size: 10.5px; line-height: 1.4; }
.label { width: 302px; height: 181px; background: #fff; color: #111; border-radius: 6px; padding: 12px 14px; font: 12px var(--font); box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; flex-direction: column; justify-content: space-between; }
.label .l1 { font-weight: 700; font-size: 15px; }
.label .l2 { display: flex; justify-content: space-between; font-size: 12px; }
.label .bc { height: 44px; }
.label .bc svg { width: 100%; height: 100%; }
.label .code { font: 12px var(--mono); text-align: center; letter-spacing: .08em; }

/* Device art */
.dev { display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 35%, #fbfbfd, #eceef2); border-radius: 12px; overflow: hidden; }
.dev svg { height: 86%; width: auto; max-width: 86%; filter: drop-shadow(0 8px 14px rgba(0,0,0,.14)); }

<script>
/* Phonemen mockups: shared UI helpers — device art, QR and barcode art, toast, modal, printouts. */
(function () {
  'use strict';
  const PM = window.PM;
  const hkd = PM.hkd;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const now = () => PM.TODAY + ' ' + new Date().toTimeString().slice(0, 5);
  const maskPhone = p => (p || '').replace(/(\d{4})\s?(\d{4})/, '$1 ****');
  let uid = 0;

  // ---------- colour helpers ----------
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    const ch = v => Math.round((t - v) * p + v);
    const r = ch(n >> 16), g = ch((n >> 8) & 255), b = ch(n & 255);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };

  // ---------- device art ----------
  const APPLE = 'M10 6C8 4.5 4 5 4 10c0 4 3 8 5 8 1 0 1.5-.5 3-.5s2 .5 3 .5c2 0 4-3.5 4.5-5.5-2-1-2.5-4-1-5.5-1-1.5-3-2-4.5-1.5S11.5 6.5 10 6zM12 4.5c0-1.5 1.5-3 3-3 0 1.5-1.5 3-3 3z';
  const apple = (cx, cy, s, fill) => `<path d="${APPLE}" transform="translate(${cx - s} ${cy - s}) scale(${s / 10})" fill="${fill}" opacity=".55"/>`;
  const wall = id => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs>`;

  function phone(m, hex, view) {
    const edge = shade(hex, -0.22);
    if (view === 'front') {
      const g = 'w' + (++uid);
      if (m.se) return `<svg viewBox="0 0 120 240" xmlns="http://www.w3.org/2000/svg">${wall(g)}<rect x="10" y="4" width="100" height="232" rx="18" fill="${edge}"/><rect x="12" y="6" width="96" height="228" rx="16" fill="#111"/><rect x="18" y="40" width="84" height="150" rx="2" fill="url(#${g})"/><rect x="48" y="22" width="24" height="4" rx="2" fill="#333"/><circle cx="60" cy="212" r="11" fill="none" stroke="#444" stroke-width="2"/></svg>`;
      const hole = m.family === 'Android' ? '<circle cx="60" cy="20" r="4" fill="#000"/>' : '<rect x="44" y="15" width="32" height="10" rx="5" fill="#000"/>';
      return `<svg viewBox="0 0 120 240" xmlns="http://www.w3.org/2000/svg">${wall(g)}<rect x="10" y="4" width="100" height="232" rx="20" fill="${edge}"/><rect x="12" y="6" width="96" height="228" rx="18" fill="#0b0b0c"/><rect x="16" y="10" width="88" height="220" rx="15" fill="url(#${g})"/>${hole}<text x="60" y="64" text-anchor="middle" font-size="18" font-family="Arial" fill="#fff" opacity=".9">10:09</text></svg>`;
    }
    const bump = shade(hex, lum(hex) > 0.6 ? -0.08 : 0.1);
    let cam;
    if (m.pixel) cam = `<rect x="12" y="44" width="96" height="22" rx="6" fill="#1d1d1f"/><circle cx="40" cy="55" r="6" fill="#0c0c0e" stroke="#555"/><circle cx="58" cy="55" r="6" fill="#0c0c0e" stroke="#555"/><circle cx="80" cy="55" r="2.5" fill="#f5f5f5"/>`;
    else if (m.family === 'Android') cam = [26, 46, 66].map(y => `<circle cx="30" cy="${y}" r="7.5" fill="#111" stroke="${edge}" stroke-width="2"/>`).join('') + `<circle cx="50" cy="30" r="5" fill="#111" stroke="${edge}"/><circle cx="50" cy="46" r="2.5" fill="#eee"/>`;
    else if (m.se) cam = `<circle cx="28" cy="26" r="7" fill="#111" stroke="${edge}" stroke-width="2"/><circle cx="28" cy="41" r="2.5" fill="#eee"/>`;
    else if (m.pro) cam = `<rect x="20" y="14" width="50" height="50" rx="14" fill="${bump}" stroke="${edge}"/><circle cx="33" cy="27" r="9" fill="#141416" stroke="#4a4a4f" stroke-width="2"/><circle cx="33" cy="51" r="9" fill="#141416" stroke="#4a4a4f" stroke-width="2"/><circle cx="56" cy="39" r="9" fill="#141416" stroke="#4a4a4f" stroke-width="2"/><circle cx="57" cy="22" r="3" fill="#f3f3f3"/><circle cx="57" cy="56" r="3" fill="#2a2a2a"/>`;
    else cam = `<rect x="20" y="14" width="40" height="50" rx="13" fill="${bump}" stroke="${edge}"/><circle cx="32" cy="27" r="8.5" fill="#141416" stroke="#4a4a4f" stroke-width="2"/><circle cx="48" cy="51" r="8.5" fill="#141416" stroke="#4a4a4f" stroke-width="2"/><circle cx="50" cy="26" r="2.8" fill="#f3f3f3"/>`;
    const logo = m.family === 'iPhone' ? apple(60, 122, 9, edge) : m.family === 'Android' && !m.pixel ? `<text x="60" y="200" text-anchor="middle" font-size="8" font-family="Arial" fill="${edge}" opacity=".7">SAMSUNG</text>` : '';
    return `<svg viewBox="0 0 120 240" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="4" width="100" height="232" rx="20" fill="${edge}"/><rect x="12" y="6" width="96" height="228" rx="18" fill="${hex}"/>${cam}${logo}</svg>`;
  }

  function tablet(m, hex, view) {
    const edge = shade(hex, -0.22);
    if (view === 'front') {
      const g = 'w' + (++uid);
      return `<svg viewBox="0 0 170 240" xmlns="http://www.w3.org/2000/svg">${wall(g)}<rect x="6" y="4" width="158" height="232" rx="16" fill="${edge}"/><rect x="8" y="6" width="154" height="228" rx="14" fill="#0b0b0c"/><rect x="16" y="14" width="138" height="212" rx="8" fill="url(#${g})"/></svg>`;
    }
    return `<svg viewBox="0 0 170 240" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="4" width="158" height="232" rx="16" fill="${edge}"/><rect x="8" y="6" width="154" height="228" rx="14" fill="${hex}"/><rect x="18" y="16" width="20" height="20" rx="6" fill="${shade(hex, -0.1)}"/><circle cx="28" cy="26" r="5" fill="#141416"/>${apple(85, 120, 11, edge)}</svg>`;
  }

  function laptop(m, hex, view) {
    const edge = shade(hex, -0.22);
    if (view === 'front') {
      const g = 'w' + (++uid);
      return `<svg viewBox="0 0 240 170" xmlns="http://www.w3.org/2000/svg">${wall(g)}<rect x="30" y="10" width="180" height="120" rx="8" fill="#0b0b0c" stroke="${edge}" stroke-width="2"/><rect x="38" y="18" width="164" height="104" rx="2" fill="url(#${g})"/><path d="M14 132h212l-10 16H24z" fill="${hex}" stroke="${edge}"/><rect x="104" y="132" width="32" height="4" rx="2" fill="${edge}"/></svg>`;
    }
    return `<svg viewBox="0 0 240 170" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="16" width="200" height="138" rx="10" fill="${edge}"/><rect x="22" y="18" width="196" height="134" rx="9" fill="${hex}"/>${apple(120, 85, 12, edge)}</svg>`;
  }

  function watch(m, hex, view) {
    const band = shade(hex, -0.05);
    const face = view === 'front'
      ? `<rect x="33" y="55" width="54" height="90" rx="14" fill="#000"/><text x="60" y="96" text-anchor="middle" font-size="17" font-family="Arial" fill="#fff">10:09</text><text x="60" y="114" text-anchor="middle" font-size="8" font-family="Arial" fill="#f97316">MON 2</text>`
      : `<circle cx="60" cy="100" r="22" fill="#2a2a2c" stroke="#555"/><circle cx="60" cy="100" r="8" fill="#111"/>`;
    return `<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg"><rect x="36" y="0" width="48" height="58" rx="8" fill="${band}"/><rect x="36" y="142" width="48" height="58" rx="8" fill="${band}"/><rect x="24" y="44" width="72" height="112" rx="22" fill="${view === 'front' ? '#1c1c1e' : shade(hex, -0.15)}" stroke="${hex}" stroke-width="5"/>${face}<rect x="97" y="80" width="6" height="18" rx="3" fill="${hex}"/></svg>`;
  }

  // view: back | front | tilt | detail
  function deviceSVG(modelId, hex, view) {
    const m = typeof modelId === 'string' ? PM.modelOf(modelId) : modelId;
    const v = view === 'tilt' || view === 'detail' ? 'back' : view || 'back';
    const fn = m.family === 'iPad' ? tablet : m.family === 'Mac' ? laptop : m.family === 'Watch' ? watch : phone;
    let svg = fn(m, hex || m.colors[0][1], v);
    if (view === 'tilt') svg = svg.replace(/<svg ([^>]*)>/, '<svg $1><g transform="rotate(-14 60 120) translate(0 4)">').replace(/<\/svg>$/, '</g></svg>');
    if (view === 'detail') svg = svg.replace(/viewBox="0 0 (\d+) (\d+)"/, (s, w, h) => `viewBox="0 0 ${Math.round(w * 0.62)} ${Math.round(h * 0.38)}"`);
    return svg;
  }
  const PHOTO_VIEWS = ['back', 'front', 'tilt', 'detail', 'back', 'front'];
  const photoSVG = (u, i) => deviceSVG(u.model, u.hex, PHOTO_VIEWS[i % PHOTO_VIEWS.length]);

  // ---------- QR and barcode art (look-alikes, not scannable) ----------
  function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function qrSVG(text) {
    const n = 25; let h = hash(text) || 1; let cells = '';
    const inFinder = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (inFinder(x, y)) continue;
      h = (Math.imul(h, 1103515245) + 12345) >>> 0;
      if ((h >>> 16) % 2 === 0) cells += `M${x} ${y}h1v1h-1z`;
    }
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#000"/>`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${cells}" fill="#000"/>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
  }
  function barcodeSVG(text) {
    let bits = '11010010000';
    for (const c of String(text)) bits += (hash(c + text.length) >>> 3).toString(2).padStart(11, '0').slice(-11) + '0';
    bits += '1100011101011';
    let x = 0, d = '';
    for (const b of bits) { if (b === '1') d += `M${x} 0h1v40h-1z`; x++; }
    return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
  }

  function receiptSale(d) {

  function slipBuyback(d) {
    const fails = (d.faults || []).length ? d.faults.map(PM.checkName).join('、') : '全部合格';

  }

  function ticketRepair(d) {
    return `<div class="receipt">${head('維修單')}${row('單號', esc(d.no))}${row('收機日期', esc(d.date))}${row('客戶', esc(d.name) + ' ' + maskPhone(d.phone))}<div class="rule"></div><div>${esc(d.device)} ${esc(d.color || '')}</div>${row('IMEI / 序號', esc(d.imei || '-'))}<div class="small" style="margin:4px 0">問題：${esc(d.issue)}</div><div class="rule"></div>${row('報價', d.quote ? hkd(d.quote) : '待檢查')}${row('訂金', hkd(d.deposit || 0))}${row('預計取機', esc(d.eta))}<div class="rule"></div><div class="small">取機時請出示此單。維修部分保養 30 日。機主確認已備份資料。</div><div class="qr">${qrSVG(d.no)}</div><div class="c small">掃描查看維修進度</div></div>`;
  }

  function label(u) {
    const m = PM.modelOf(u.model);
    return `<div class="label"><div><div class="l1">${esc(m.name)} ${esc(u.cap)}</div><div class="l2"><span>${esc(u.color)} · ${esc(u.grade)}${u.battery ? ' · 電池 ' + u.battery + '%' : ''}</span></div></div><div class="bc">${barcodeSVG(u.code)}</div><div class="l2"><span class="code">${esc(u.code)}</span><b>${hkd(u.price)}</b></div></div>`;
  }

  // ---------- signature pad ----------
  function signaturePad(canvas) {
    const ctx = canvas.getContext('2d');
    let drawing = false, empty = true, last = null;
    const pos = e => { const r = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return [(p.clientX - r.left) * canvas.width / r.width, (p.clientY - r.top) * canvas.height / r.height]; };
    const start = e => { drawing = true; last = pos(e); e.preventDefault(); };
    const move = e => { if (!drawing) return; const p = pos(e); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; empty = false; e.preventDefault(); };
    const end = () => { drawing = false; };
    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end);
    return {
      clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); empty = true; },
      isEmpty: () => empty,
      toDataURL: () => canvas.toDataURL('image/png'),
      demo() { this.clear(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); const w = canvas.width, h = canvas.height; ctx.moveTo(w * .12, h * .62); for (let i = 0; i <= 40; i++) { const x = w * (.12 + i * .018); ctx.lineTo(x, h * (.55 + Math.sin(i * .7) * .18 - i * .002)); } ctx.stroke(); empty = false; },
    };
  }

  // Links between the mockups. The single-file bundles (dist/) override these paths.
  const LINKS = Object.assign({ hub: '../', a: '../a/', b: '../b/', shop: '../shop/' }, window.PM_LINKS || {});
  const link = (app, hash) => LINKS[app] + (hash || '');
  const shopURL = hash => link('shop', hash);

  const STATUS = {
    qc: { label: '待QC', tone: 'amber' },
    refurb: { label: '翻新中', tone: 'orange' },
    ready: { label: '可上架', tone: 'sky' },
    listed: { label: '已上架', tone: 'green' },
    reserved: { label: '已預留', tone: 'violet' },
    sold: { label: '已售', tone: 'slate' },
  };

  window.UI = { esc, $, $$, now, hkd, maskPhone, shade, lum, deviceSVG, photoSVG, qrSVG, barcodeSVG, toast, modal, printPreview, receiptSale, slipBuyback, ticketRepair, label, signaturePad, STATUS, plusMonths, link, shopURL };
})();

</script>
<script>
/* Proposal A — familiar: today's ERP screens rebuilt one-for-one, plus the new modules in the same style. */
(function () {
  'use strict';
  const { store, hkd, modelOf, unitTitle, TODAY } = PM;
  const { esc, $, $$, toast } = UI;
  const S = () => store.get();
  const NEW = '<span class="new">新</span>';
  const nospace = p => String(p || '').replace(/\s/g, '');
  const fmtPhone = p => { const d = nospace(p); return /^\d{8}$/.test(d) ? d.slice(0, 4) + ' ' + d.slice(4) : d; };
  const money = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const SALES = ['Alan', 'Bonnie', 'Carmen'];
  const ME = 'USR03';

  // ---------------------------------------------------------------- menu
  const MENU = [
    { name: '二手機管理', items: [['收機', '/buyback', 1], ['賣二手機', '/invoice'], ['二手機資料', '/units', 1], ['二手機庫存', '/stock'], ['二手機銷售報表', ''], ['維修記錄', '/refurb'], ['標籤打印', '/labels', 1]] },
    { name: '維修管理', isNew: 1, items: [['客戶維修單', '/repair', 1], ['維修預約', '/bookings', 1], ['維修報表', '', 1]] },
    { name: '網店管理', isNew: 1, items: [['網頁內容', '/cms-pages', 1], ['橫幅及推廣', '/cms-banners', 1], ['回收價目表', '/cms-matrix', 1], ['網店訂單', '/web-orders', 1], ['網上回收報價', '/leads', 1]] },
    { name: '會計管理', items: [['收款傳票', '/receipts'], ['日結報表', '/dayend', 1]] },
    { name: '代碼設定', items: [['客戶', ''], ['平台', ''], ['業務員', '']] },
  ];
  function renderMenu() {
    const bar = $('#menubar');
    bar.innerHTML = MENU.map((g, i) => `<div class="mi" data-i="${i}">${g.name}${g.isNew ? NEW : ''}<div class="dd">${g.items.map(([label, path, isNew]) => `<a href="#${path}" data-path="${path}">${label}${isNew ? NEW : ''}</a>`).join('')}</div></div>`).join('');
    const closeAll = () => $$('.mi.open', bar).forEach(m => m.classList.remove('open'));
    bar.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (a) { e.preventDefault(); closeAll(); if (a.dataset.path) go(a.dataset.path); else toast('此畫面未包括在示範內'); return; }
      const mi = e.target.closest('.mi');
      if (!mi) return;
      const open = mi.classList.contains('open');
      closeAll();
      if (!open) mi.classList.add('open');
    });
    bar.addEventListener('mouseover', e => { const mi = e.target.closest('.mi'); if (mi && $('.mi.open', bar) && !mi.classList.contains('open')) { closeAll(); mi.classList.add('open'); } });
    document.addEventListener('click', e => { if (!e.target.closest('.menubar')) closeAll(); });
  }

  // ---------------------------------------------------------------- generic list screen
  const dateFilters = (label, from) => `<label>${label} 從</label><input value="${from || '2026-10-02'}"><span>至</span><input value="${TODAY}"><span><button type="button" class="jb go" data-act="go">GO</button></span>`;
  const lkRow = (label, value) => `<label>${label}</label><div class="lk"><input class="plain" value="${esc(value || '')}"><button type="button" tabindex="-1">🔍</button></div><span></span><span></span><span></span>`;

  // Each screen renders into a fresh container so old listeners never pile up.
  function fresh() { const host = $('#screen'); const el = document.createElement('div'); host.replaceChildren(el); return el; }

  function listScreen(cfg) {
    document.title = cfg.name + '(手機俠有限公司)';
    const el = fresh();
    const rows = cfg.rows;
    const cols = cfg.columns;
    let sel = null;
    const btn = b => `<button type="button" class="jb ${b.c || 'w'}" data-act="${b.id}">${b.label}${b.isNew ? NEW : ''}</button>`;
    el.innerHTML = `
      <div class="ls-top">
        <div class="ls-filters">${cfg.filters || dateFilters('日期')}</div>
        <div class="ls-right"><div class="ls-btns">${(cfg.buttons || []).map(btn).join('')}</div>
          <div class="counters"><div>總記錄數<b class="n-all">${rows.length}</b></div><div>當前記錄數<b class="n-cur">${rows.length}</b></div></div></div>
      </div>
      ${cfg.note ? `<div class="ls-note">${cfg.note}</div>` : ''}
      <div class="jgrid" style="height:${cfg.height || 'calc(100vh - 236px)'}"><table>
        <thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}" style="min-width:${c.w || 90}px">${c.t}</th>`).join('')}</tr>
        <tr class="frow">${cols.map((c, i) => `<th>${c.nofilter ? '' : `<input data-col="${i}" aria-label="篩選${esc(c.t)}">`}</th>`).join('')}</tr></thead>
        <tbody></tbody><tfoot><tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}"></td>`).join('')}</tr></tfoot>
      </table></div>
      <div class="ls-bottom"><div>${(cfg.bottomLeft || []).map(b => btn({ c: 'w', ...b })).join('')}</div>
        <div>${btn({ id: 'cols', label: '選擇欄位' })}${btn({ id: 'filter', label: '過濾' })}${btn({ id: 'excel', label: '導出Excel' })}${btn({ id: 'listprint', label: '列表打印' })}</div></div>
      <div class="audit">建立人<b class="a1">-</b>建立時間<b class="a2">-</b>修改人<b class="a3">-</b>修改時間<b class="a4">-</b></div>`;
    const tbody = $('tbody', el);
    const val = (c, r) => (typeof c.f === 'function' ? c.f(r) : r[c.f]);
    const cell = (c, r) => {
      if (c.html) return c.html(r);
      const v = val(c, r);
      return c.num ? (v === '' || v == null ? '' : money(v)) : esc(v == null ? '' : v);
    };
    let shown = rows;
    function draw() {
      const fs = $$('.frow input', el).map(i => [+i.dataset.col, i.value.trim().toLowerCase()]).filter(x => x[1]);
      shown = rows.filter(r => fs.every(([i, q]) => String(val(cols[i], r) == null ? '' : val(cols[i], r)).toLowerCase().includes(q)));
      tbody.innerHTML = shown.length ? shown.map(r => `<tr data-i="${rows.indexOf(r)}" class="${r === sel ? 'sel' : ''}">${cols.map(c => `<td class="${c.num ? 'num' : ''} ${c.cls ? c.cls(r) : ''}">${cell(c, r)}</td>`).join('')}</tr>`).join('') : `<tr class="empty"><td colspan="${cols.length}">No data to display</td></tr>`;
      $('.n-cur', el).textContent = shown.length;
      const tds = $$('tfoot td', el);
      cols.forEach((c, i) => { tds[i].textContent = c.sum ? money(shown.reduce((s, r) => s + (Number(val(c, r)) || 0), 0)) : ''; });
      if (!cols[0].sum) tds[0].textContent = shown.length;
    }
    function select(r) {
      sel = r;
      $$('tbody tr', el).forEach(tr => tr.classList.toggle('sel', rows[+tr.dataset.i] === r));
      const a = cfg.audit ? cfg.audit(r) : [r.staff || ME, (r.date || r.bought || TODAY) + ' 12:00:00', ME, TODAY + ' ' + UI.now().slice(11) + ':00'];
      ['.a1', '.a2', '.a3', '.a4'].forEach((k, i) => { $(k, el).textContent = a[i] || '-'; });
    }
    el.addEventListener('input', e => { if (e.target.closest('.frow')) draw(); });
    tbody.addEventListener('click', e => { const tr = e.target.closest('tr[data-i]'); if (tr) select(rows[+tr.dataset.i]); });
    tbody.addEventListener('dblclick', e => { const tr = e.target.closest('tr[data-i]'); if (tr && cfg.onOpen) cfg.onOpen(rows[+tr.dataset.i]); });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const id = b.dataset.act;
      const need = () => { if (!sel) { toast('請先選擇一條記錄'); return false; } return true; };
      if (cfg.onAction && cfg.onAction(id, sel, api) === true) return;
      if (id === 'go') { draw(); toast('已重新查詢'); }
      else if (id === 'add') cfg.onAdd ? cfg.onAdd() : toast('示範未包括');
      else if (id === 'view') { if (need()) cfg.onOpen ? cfg.onOpen(sel) : toast('示範未包括'); }
      else if (id === 'print') { if (need()) cfg.onPrint ? cfg.onPrint(sel) : toast('示範未包括'); }
      else if (id === 'del' || id === 'void') { if (need()) toast('示範：不會刪除或註銷資料'); }
      else if (id === 'copy') { if (need()) toast('示範：已複製為新單'); }
      else if (id === 'excel') toast('已匯出 Excel（示範）');
      else if (id === 'listprint') toast('列表已送到打印機（示範）');
      else if (id === 'cols') toast('示範：選擇顯示欄位');
      else if (id === 'filter') { const i = $('.frow input', el); if (i) i.focus(); }
      else toast('示範未包括');
    });
    const api = { redraw: draw, get selected() { return sel; }, select };
    draw();
    return api;
  }

  // ---------------------------------------------------------------- generic entry window (資料錄入)
  function fieldHTML(f) {
    const id = f.id ? ` id="${f.id}"` : '';
    let ctl;
    if (f.html != null) ctl = f.html;
    else if (f.type === 'select') ctl = `<select${id}${f.ro ? ' disabled' : ''}>${f.options.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(v) === String(f.value) ? ' selected' : ''}>${esc(t)}</option>`; }).join('')}</select>`;
    else if (f.type === 'textarea') ctl = `<textarea${id}${f.ro ? ' readonly' : ''}>${esc(f.value || '')}</textarea>`;
    else ctl = `<input${id}${f.ro ? ' readonly' : ''} value="${esc(f.value == null ? '' : f.value)}"${f.num ? ' class="num"' : ''}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}>`;
    if (f.lookup) ctl = `<div class="lk">${ctl}<button type="button" tabindex="-1" data-btn="lookup-${f.id || ''}">🔍</button></div>`;
    return `<label class="${f.req ? 'req' : ''}">${f.label}</label><div>${ctl}</div>`;
  }
  const formHTML = (left, right) => `<div class="ew-form"><div class="ew-col">${(left || []).map(fieldHTML).join('')}</div><div class="ew-col">${(right || []).map(fieldHTML).join('')}</div></div>`;

  function entryWindow(cfg) {
    const ov = document.createElement('div');
    ov.className = 'ew-ov';
    const btns = (cfg.buttons || []).map(b => `<button type="button" class="jb ${b.c}" data-btn="${b.id}"${b.disabled ? ' disabled' : ''}>${b.label}${b.isNew ? NEW : ''}</button>`).join('');
    const audit = cfg.audit || [ME, UI.now() + ':00', '', ''];
    ov.innerHTML = `<div class="ew"${cfg.width ? ` style="width:min(${cfg.width}px,97vw)"` : ''}>
      <div class="ew-title"><span>${cfg.winTitle || '資料錄入'}</span><button type="button" class="ew-x" data-btn="back" aria-label="關閉">×</button></div>
      <div class="ew-body">
        <div class="ew-head"><h1>位置 <span class="pos">01</span> ${cfg.title}</h1><div class="ew-btns">${btns}</div></div>
        <div class="ew-main">${formHTML(cfg.left, cfg.right)}${cfg.side != null ? `<div class="ew-side">${cfg.side}</div>` : ''}</div>
        ${cfg.below || ''}
      </div>
      ${cfg.footer === false ? '' : `<div class="ew-foot">建立人<b>${esc(audit[0])}</b>建立時間<b>${esc(audit[1])}</b>修改人<b>${esc(audit[2])}</b>修改時間<b>${esc(audit[3])}</b></div>`}
    </div>`;
    document.body.appendChild(ov);
    const api = {
      el: $('.ew', ov),
      close() { ov.remove(); if (cfg.onClose) cfg.onClose(); },
      val: id => { const x = $('#' + id, ov); return x ? x.value : ''; },
      set: (id, v) => { const x = $('#' + id, ov); if (x) x.value = v; },
      side: html => { const s = $('.ew-side', ov); if (s) s.innerHTML = html; },
    };
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-btn]');
      if (!b || b.disabled) return;
      if (b.dataset.btn === 'back') { api.close(); return; }
      if (cfg.onButton) cfg.onButton(b.dataset.btn, api, b);
    });
    if (cfg.after) cfg.after(api);
    return api;
  }

  function promptWin(title, fields, okLabel, onOk) {
    entryWindow({ title, width: 720, footer: false, winTitle: title, buttons: [{ id: 'ok', label: okLabel || '確定', c: 'blue' }, { id: 'back', label: '返回', c: 'orange' }], left: fields, right: [], onButton(id, api) { if (id === 'ok' && onOk(api) !== false) api.close(); } });
  }

  const gridHTML = (cols, rowsHTML, height) => `<div class="jgrid" style="height:${height || 'auto'};min-height:120px"><table><thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}" style="min-width:${c.w || 80}px">${c.t}</th>`).join('')}</tr></thead><tbody>${rowsHTML}</tbody></table></div>`;
  const checklistHTML = (state, ro) => `<div class="chklist">${PM.CHECKS.map(c => `<label>${c.name}<input type="checkbox" data-chk="${c.id}"${state[c.id] ? ' checked' : ''}${ro ? ' disabled' : ''}></label>`).join('')}</div>`;
  const readChecks = api => $$('[data-chk]', api.el).filter(i => i.checked).map(i => i.dataset.chk);

  // ---------------------------------------------------------------- listing rule (Proposal A)
  function webState(u) {
    if (u.status === 'listed') return '已上架';
    if (u.status === 'reserved') return '已預留';
    if (u.status === 'refurb') return '維修中';
    if (u.status === 'qc') return '待檢查';
    if (u.status === 'sold') return '已售';
    return !u.photos ? '待影相' : u.hold ? '暫停上架' : '待上架';
  }
  // A unit with photos and a price lists itself automatically unless staff untick 上架.
  function syncListing(u) {
    if (!['ready', 'listed'].includes(u.status)) return;
    const before = u.status;
    u.status = u.photos > 0 && u.price > 0 && !u.hold ? 'listed' : 'ready';
    if (before !== u.status) u.events.push({ d: TODAY, type: u.status === 'listed' ? '上架' : '落架', note: u.status === 'listed' ? `網店自動上架，售價 ${hkd(u.price)}` : '暫停上架', by: ME });
  }
  const shopLink = u => UI.shopURL(`#/p/${modelOf(u.model).slug}?u=${u.code}`);

  // ---------------------------------------------------------------- 賣二手機
  function saleData(inv) {
    const pays = S().receipts.filter(r => r.inv === inv.no).map(r => ({ method: r.method, amount: r.amount }));
    if (inv.received < inv.amount) pays.push({ method: '未收', amount: inv.amount - inv.received });
    return {
      no: inv.no, date: inv.date + ' ' + UI.now().slice(11), staff: inv.staff, channel: inv.channel,
      customer: inv.phone ? { name: inv.name, phone: inv.phone } : null,
      lines: inv.lines.map(l => { const u = PM.unit(l.code); return { title: l.name, code: l.code, grade: l.grade || (u ? u.grade : ''), battery: u ? u.battery : '', imei: l.imei, price: l.price }; }),
      payments: pays, total: inv.amount,
    };
  }
  const printInvoice = inv => UI.printPreview(UI.receiptSale(saleData(inv)), { title: '列印預覽 · 發票/收據 80mm' });

  function invoiceList() {
    listScreen({
      name: '賣二手機',
      rows: S().invoices,
      filters: dateFilters('發票日期') + lkRow('客戶編號') + lkRow('分店', '01'),
      buttons: [{ id: 'copy', label: '複製', c: 'blue' }, { id: 'add', label: '新增', c: 'green' }, { id: 'view', label: '查看', c: 'orange' }, { id: 'del', label: '刪除', c: 'red' }, { id: 'print', label: '打印', c: 'w' }],
      columns: [
        { t: '發票單號', f: 'no', w: 106 }, { t: '發票日期', f: 'date', w: 86 }, { t: '客戶編號', f: r => nospace(r.phone), w: 84 },
        { t: '客戶名稱', f: 'name', w: 96 }, { t: '平台', f: 'channel', w: 76 }, { t: '業務員', f: 'staff', w: 64 },
        { t: '貨品內容', f: r => r.lines.map(l => l.code).join(' '), w: 92 }, { t: '貨品名稱', f: r => r.lines.map(l => l.name).join('、'), w: 210 },
        { t: 'IMEI', f: r => r.lines.map(l => l.imei).join(' '), w: 132 }, { t: '貨幣', f: () => 'HKD', w: 48 },
        { t: '共金額(HKD)', f: 'amount', num: true, sum: true, w: 96 }, { t: '備註', f: 'note', w: 110 },
        { t: '已收金額', f: 'received', num: true, sum: true, w: 92, cls: r => (r.received < r.amount ? 'red' : '') },
      ],
      bottomLeft: [{ id: 'r1', label: '客戶匯總' }, { id: 'r2', label: '貨品匯總' }, { id: 'r3', label: '發票明細' }],
      onAction(id) { if (/^r\d$/.test(id)) { toast('示範：開啟匯總報表'); return true; } },
      onAdd: () => invoiceWindow(),
      onOpen: r => invoiceWindow(r),
      onPrint: printInvoice,
    });
  }

  const lineFromUnit = u => ({ code: u.code, name: unitTitle(u), imei: u.imei || u.serial, price: u.price, grade: u.grade, cap: u.cap, color: u.color, region: PM.REGIONS[u.region], battery: u.battery });
  const findUnit = q => { q = String(q || '').trim().toUpperCase(); return q ? S().units.find(u => u.code === q || u.imei === q || u.serial === q) : null; };

  function invoiceWindow(inv, prefill) {
    const isNew = !inv;
    const p = prefill || {};
    const lines = inv ? inv.lines.map(l => { const u = PM.unit(l.code); return u ? lineFromUnit(Object.assign({}, u, { price: l.price })) : { ...l, cap: '', color: '', region: '', battery: '' }; }) : (p.lines || []);
    const samples = S().units.filter(u => u.status === 'listed').slice(0, 3);
    const lineCols = [

    function addByCode(api, code) {
      const u = findUnit(code);
      if (!u) return toast('找不到此貨品編號或 IMEI');
      if (u.status === 'sold') return toast('此貨品已售出');
      if (u.status === 'qc' || u.status === 'refurb') return toast('此貨品' + UI.STATUS[u.status].label + '，未可出售');
      if (lines.some(l => l.code === u.code)) return toast('此貨品已在發票內');
      if (u.status === 'reserved') { const c = PM.customer(u.reserved.by); toast(`注意：此機已預留給 ${c ? c.name : u.reserved.by}，訂金 ${hkd(u.reserved.deposit)}`); }
      lines.push(lineFromUnit(u));
      drawLines(api);
    }
    function drawLines(api) {
      $('tbody', api.el).innerHTML = lines.map((l, i) => `<tr data-l="${i}"><td>${esc(l.code)}</td><td>${esc(l.imei)}</td><td>${esc(l.name)}</td><td>PCS</td><td class="num">1</td><td class="num">${money(l.price)}</td><td class="num">0.00</td><td class="num">${money(l.price)}</td><td class="num">${money(l.price)}</td><td>${esc(l.grade)}</td><td>${esc(l.cap)}</td><td>${esc(l.region)}</td><td>${l.battery ? l.battery + '%' : ''}</td></tr>`).join('') || '<tr class="empty"><td colspan="13" style="height:120px">掃描或輸入 IMEI 加入貨品</td></tr>';
      const total = lines.reduce((s, l) => s + l.price, 0);
      api.set('f-goods', money(total));
      api.set('f-total', money(total));
    }
  }

  function saveInvoice(api, lines) {
    if (!lines.length) { toast('請先加入貨品'); return null; }
    const phone = fmtPhone(api.val('f-cust'));
    const name = api.val('f-name') || (phone ? '新客戶' : '散客');
    if (phone) PM.upsertCustomer(phone, name);
    const inv = { no: PM.nextNo('inv'), date: api.val('f-date') || TODAY, phone, name, channel: api.val('f-ch'), staff: api.val('f-staff'), lines: lines.map(l => ({ code: l.code, name: l.name, imei: l.imei, price: l.price, grade: l.grade })), amount: lines.reduce((s, l) => s + l.price, 0), received: 0, note: api.val('f-note') };
    S().invoices.unshift(inv);
    lines.forEach(l => {
      const u = PM.unit(l.code);
      if (!u) return;
      u.status = 'sold';
      u.sold = { date: inv.date, to: phone, channel: inv.channel, pay: '', price: l.price, staff: inv.staff, inv: inv.no };
      u.reserved = null;
      u.events.push({ d: inv.date, type: '售出', note: `${inv.channel}，發票 ${inv.no}，${hkd(l.price)}`, by: inv.staff });
    });
    store.save();
    return inv;
  }

  function payWindow(inv, after) {
    promptWin('收款傳票', [
      { label: '收款傳票號', value: 'NEW', ro: true },
      { label: '發票號碼', value: inv.no, ro: true },

      { label: '支票號碼', value: '' },
    ], '確定收款', api => {
      const amount = parseFloat(api.val('p-amt')) || 0;
      if (amount <= 0) { toast('請輸入金額'); return false; }
      const method = api.val('p-m');
      S().receipts.unshift({ no: PM.nextNo('rv'), date: inv.date, phone: inv.phone, name: inv.name, method, amount, inv: inv.no });
      inv.received += amount;
      inv.lines.forEach(l => { const u = PM.unit(l.code); if (u && u.sold) u.sold.pay = method; });
      store.save();
      toast('已建立收款傳票，發票已收 ' + hkd(inv.received));
      route();
      if (after) setTimeout(after, 50);
    });
  }

    ];
    const productRight = () => [
      { label: '新舊', req: true, id: 'b-grade', type: 'select', options: PM.GRADES.map(g => [g.id, g.id + ' ' + g.name]), value: u ? u.grade : p.grade || 'A', ro: !isNew },

      { label: '版本', id: 'b-os', value: u ? u.os : m().os, ro: !isNew },
      { label: '參考收購價', id: 'b-ref', num: true, ro: true },
      { label: '預設售價', id: 'b-sell', num: true, value: u ? u.price : '', ro: !isNew },
    ];
    const w = entryWindow({
      title: '收機',
      audit: slip ? [slip.staff, slip.date + ' 13:05:12', ME, slip.date + ' 13:05:12'] : null,
      buttons: [{ id: 'print', label: '打印', c: 'blue' }, { id: 'addnew', label: '加單', c: 'w' }, { id: 'edit', label: '修改', c: 'blue', disabled: isNew }, { id: 'save', label: '保存', c: isNew ? 'green' : 'dis', disabled: !isNew }, { id: 'back', label: '返回', c: 'orange' }],
      left: [
        { label: '單號', value: slip ? slip.no : 'NEW', ro: true },
        { label: '客戶編號', req: true, id: 'b-phone', lookup: true, value: slip ? nospace(slip.phone) : nospace(p.phone), ph: '輸入電話號碼', ro: !isNew },
        { label: '客戶名稱', req: true, id: 'b-name', value: slip ? slip.name : p.name || '', ro: !isNew },
        { label: '證件號碼', id: 'b-id', value: slip ? slip.idno || '' : '', ph: '選填，例如 A123***(*)', ro: !isNew },

        { label: '收機日期', req: true, value: slip ? slip.date : TODAY, ro: true },

        { label: '經手人', id: 'b-staff', type: 'select', options: SALES, value: slip ? slip.staff : 'Bonnie', ro: !isNew },

      below: `<div class="ew-sec"><h3>貨品資料</h3><div id="b-product">${formHTML(productLeft(), productRight())}</div></div>`,
      after(api) { if (isNew) bind(api); recalc(api); },

        if (id === 'scanimei') { api.set('b-imei', m().cellular === false ? PM.makeSerial() : PM.makeImei()); toast('已讀取 IMEI（示範）'); return; }
        if (id === 'addnew') { api.close(); buybackWindow(); return; }

    function bind(api) {
      const box = $('#b-product', api.el);
      box.addEventListener('change', e => {
        if (e.target.id === 'b-model') {
          mid = e.target.value;
          const keep = { grade: api.val('b-grade'), batt: api.val('b-batt'), region: api.val('b-region'), imei: api.val('b-imei') };
          box.innerHTML = formHTML(productLeft(), productRight());
          api.set('b-grade', keep.grade); api.set('b-batt', keep.batt); api.set('b-region', keep.region); api.set('b-imei', keep.imei); api.set('b-os', m().os);
        }
        recalc(api);
      });
      box.addEventListener('input', e => { if (e.target.id === 'b-batt') recalc(api); });
      $('.ew-side', api.el).addEventListener('change', () => recalc(api));
      $('#b-price', api.el).addEventListener('input', () => { priceTouched = true; });
      $('#b-phone', api.el).addEventListener('change', e => { const c = S().customers.find(x => nospace(x.phone) === nospace(e.target.value)); if (c) { api.set('b-name', c.name); toast('已帶出客戶資料：' + c.name); } });
    }
    function recalc(api) {
      const cap = api.val('b-cap'), grade = api.val('b-grade'), batt = +api.val('b-batt') || 0;
      const q = PM.buyQuote(mid, cap, grade, batt, readChecks(api));
      api.set('b-ref', money(q.total));
      if (isNew) {
        if (!priceTouched) api.set('b-price', q.total);
        api.set('b-sell', PM.askPrice(m(), cap, grade, batt));
      }
    }
    function save(api) {
      const phone = fmtPhone(api.val('b-phone'));
      const name = api.val('b-name');
      const imei = api.val('b-imei').trim();
      const price = parseFloat(api.val('b-price')) || 0;
      if (!phone || !name) return toast('請輸入客戶編號及名稱');
      if (!imei) return toast('請掃描或輸入 IMEI / 序號');
      if (!price) return toast('請輸入收購價');
      const faults = readChecks(api);
      const mm = m();
      const color = api.val('b-color');
      const sell = parseFloat(api.val('b-sell')) || PM.askPrice(mm, api.val('b-cap'), api.val('b-grade'), +api.val('b-batt'));
      const code = PM.nextNo('unit');
      const slipNo = PM.nextNo('slip');
      const staff = api.val('b-staff');
      PM.upsertCustomer(phone, name);
      const unit = {
        code, model: mid, cap: api.val('b-cap'), color, hex: (mm.colors.find(c => c[0] === color) || mm.colors[0])[1], grade: api.val('b-grade'), battery: +api.val('b-batt') || 0,
        region: api.val('b-region'), os: api.val('b-os'), imei: mm.cellular === false ? '' : imei, serial: mm.cellular === false ? imei : '',
        cost: price, refurb: 0, price: sell, floor: PM.r10(sell * 0.93), status: faults.length ? 'refurb' : 'ready', photos: 0, bought: TODAY, slip: slipNo,
        seller: phone, staff, faults, tech: faults.length ? 'Dicky' : '', place: faults.length ? '店內' : '', fixFrom: faults.length ? TODAY : '',
        reserved: null, sold: null, checks: {}, events: [], hold: false,
      };
      PM.CHECKS.forEach(c => { unit.checks[c.id] = faults.includes(c.id) ? 'fault' : 'ok'; });
      unit.events.push({ d: TODAY, type: '回收', note: `回收單 ${slipNo}，收購價 ${hkd(price)}`, by: staff });
      unit.events.push({ d: TODAY, type: 'QC', note: faults.length ? '發現問題：' + faults.map(PM.checkName).join('、') : '17 點檢查全部合格', by: staff });
      S().units.push(unit);
      const newSlip = { no: slipNo, date: TODAY, phone, name, idno: api.val('b-id'), code, price, pay: api.val('b-pay'), staff };
      S().slips.unshift(newSlip);
      if (faults.length) S().jobs.unshift({ no: PM.nextNo('fix'), code, date: TODAY, faults, tech: 'Dicky', place: '店內', eta: PM.day(-2), cost: 0, done: '', by: '' });
      store.save();
      api.close();
      route();
      toast(`已保存 ${slipNo}，貨品編號 ${code}`);
      printSlip(newSlip);
    }
  }

      left: [
        { label: '貨品編號', value: u.code, ro: true }, { label: 'IMEI/序號', value: u.imei || u.serial, ro: true }, { label: '貨品名稱', value: modelOf(u.model).name, ro: true },

        { label: '版本', value: u.os, ro: true }, { label: '描述', value: modelOf(u.model).no + ' / ' + (u.imei ? 'NanoSIM + eSIM' : 'Wi-Fi'), ro: true },

      onButton(id, api) {

        promptWin('確定完成', [{ label: '單號', value: sel.no, ro: true }, { label: '價錢', req: true, id: 'fx-cost', value: sel.faults.reduce((s, f) => s + PM.faultFix(f), 0), num: true }, { label: '完成人', id: 'fx-by', type: 'select', options: ['Dicky', ME] }], '確定', api => {

          if (u) {

        return true;

  function dayEnd() {
    document.title = '日結報表(手機俠有限公司)';
    const s = S();
    const rec = s.receipts.filter(r => r.date === TODAY);
    const buys = s.slips.filter(r => r.date === TODAY);
    const by = (list, key, amt) => { const m = {}; list.forEach(r => { m[r[key]] = m[r[key]] || { n: 0, a: 0 }; m[r[key]].n++; m[r[key]].a += r[amt]; }); return m; };
    const inM = by(rec, 'method', 'amount');
    const outM = by(buys, 'pay', 'price');
    const float = 8000;
    const cashIn = (inM['現金'] || { a: 0 }).a, cashOut = (outM['現金'] || { a: 0 }).a;
    const expect = float + cashIn - cashOut;
    const rowsHTML = m => Object.keys(m).map(k => `<tr><td>${esc(k)}</td><td class="num">${m[k].n}</td><td class="num">${money(m[k].a)}</td></tr>`).join('') || '<tr class="empty"><td colspan="3" style="height:60px">今日未有記錄</td></tr>';
    const el = fresh();
    el.innerHTML = `<div class="ls-top"><div class="ls-filters"><label>日期</label><input value="${TODAY}"><span></span><span></span><span><button type="button" class="jb go" data-act="go">GO</button></span><label>分店</label><div class="lk"><input class="plain" value="01"><button type="button">🔍</button></div><span></span><span></span><span></span></div>
      <div class="ls-right"><div class="ls-btns"><button type="button" class="jb w" data-act="print">打印</button><button type="button" class="jb green" data-act="close">確認日結</button></div></div></div>
      <div class="ls-note">新畫面：收款同回收付款一齊對數。現金回收會由收銀櫃支出，所以要扣減。</div>
      <div class="de">
        <div><h3>今日收款（按收款方式）</h3><div class="jgrid"><table><thead><tr><th style="min-width:120px">收款方式</th><th class="num" style="min-width:60px">筆數</th><th class="num" style="min-width:110px">金額</th></tr></thead><tbody>${rowsHTML(inM)}</tbody></table></div></div>
        <div><h3>今日回收付款（按付款方式）</h3><div class="jgrid"><table><thead><tr><th style="min-width:120px">付款方式</th><th class="num" style="min-width:60px">部數</th><th class="num" style="min-width:110px">金額</th></tr></thead><tbody>${rowsHTML(outM)}</tbody></table></div></div>
        <div class="cashbox"><div class="r"><span>開店備用金</span><span>${money(float)}</span></div><div class="r"><span>+ 現金收款</span><span>${money(cashIn)}</span></div><div class="r"><span>− 現金回收付款</span><span>${money(cashOut)}</span></div><div class="r" style="border-top:1px solid #ccc"><b>應有現金</b><b>${money(expect)}</b></div><div class="r"><span>實點現金</span><input id="de-count" value="${expect}"></div><div class="r"><span>差額</span><span class="diff" id="de-diff">0.00</span></div></div>
      </div>`;
    $('#de-count', el).addEventListener('input', e => { const d = (parseFloat(e.target.value) || 0) - expect; const x = $('#de-diff', el); x.textContent = money(d); x.style.color = d === 0 ? '#2e7d32' : '#c62828'; });
    el.onclick = e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'print') {
        const lines = Object.keys(inM).map(k => `<div class="row"><span>${esc(k)} ×${inM[k].n}</span><span>${hkd(inM[k].a)}</span></div>`).join('');
        const out = Object.keys(outM).map(k => `<div class="row"><span>回收 ${esc(k)} ×${outM[k].n}</span><span>-${hkd(outM[k].a)}</span></div>`).join('');
        UI.printPreview(`<div class="receipt"><div class="c big">手機俠 Phonemen</div><div class="c" style="font-weight:700">日結報表 ${TODAY}</div><div class="rule"></div>${lines || '<div>今日未有收款</div>'}<div class="rule"></div>${out || '<div>今日未有回收</div>'}<div class="rule"></div><div class="row"><span>應有現金</span><span>${hkd(expect)}</span></div><div class="row"><span>實點現金</span><span>${hkd(parseFloat($('#de-count', el).value) || 0)}</span></div><div class="row tot"><span>差額</span><span>${$('#de-diff', el).textContent}</span></div><div class="rule"></div><div class="small">經手人 ${ME}　　覆核 ________</div></div>`, { title: '列印預覽 · 日結 80mm' });
      } else if (b.dataset.act === 'close') toast('已確認今日日結（示範）');
      else toast('已重新查詢');
    };
  }

  // ---------------------------------------------------------------- router
  const ROUTES = {
    '/invoice': invoiceList, '/buyback': buybackList, '/units': () => unitList(false), '/stock': () => unitList(true), '/refurb': refurbList, '/labels': labelList,
    '/repair': repairList, '/bookings': bookingList, '/cms-pages': cmsPages, '/cms-banners': cmsBanners, '/cms-matrix': cmsMatrix, '/web-orders': webOrders, '/leads': leadList,
    '/receipts': receiptList, '/dayend': dayEnd,
  };
  // Hash routing, with an in-memory fallback for pages that can't change their hash (e.g. previews).
  let fallback = null;
  function go(path) {
    try { location.hash = path; } catch (e) { /* ignore */ }
    if (location.hash !== '#' + path) { fallback = path; route(); }
  }
  function route() {
    const path = fallback || (location.hash || '#/invoice').slice(1).split('?')[0];
    $$('.ew-ov').forEach(x => x.remove());
    (ROUTES[path] || invoiceList)();
  }
  window.__go = go;
  renderMenu();
  window.addEventListener('hashchange', route);
  store.on(() => { if (!$('.ew-ov')) route(); });
  route();
})();

</script>
</body>
</html>
