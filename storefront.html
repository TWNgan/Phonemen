<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">

<title>手機俠 Phonemen｜二手 iPhone 買賣、回收及維修</title>

<style>
/* Shared pieces for all three mockups: modal, toast, printouts, device art. */
:root {
  --font: -apple-system, "Segoe UI", "Microsoft JhengHei", "微軟正黑體", "PingFang HK", "Noto Sans TC", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }

/* Modal */
.pm-overlay { position: fixed; inset: 0; background: rgba(15, 18, 25, .45); display: flex; align-items: flex-start; justify-content: center; z-index: 1000; padding: 48px 16px; overflow: auto; animation: pm-fade .12s ease-out; }
.pm-modal { background: #fff; color: #18181b; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.25); width: 100%; max-width: 560px; font-family: var(--font); font-size: 14px; }
.pm-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #ececf0; font-weight: 600; font-size: 16px; }
.pm-modal-head button { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: #71717a; }
.pm-modal-body { padding: 20px; }
.pm-modal-foot { padding: 14px 20px; border-top: 1px solid #ececf0; display: flex; gap: 8px; justify-content: flex-end; }
@keyframes pm-fade { from { opacity: 0; } to { opacity: 1; } }
.pm-btn { font: 14px var(--font); padding: 8px 14px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; color: #18181b; cursor: pointer; }
.pm-btn:hover { background: #f4f4f5; }
.pm-btn.primary { background: #18181b; border-color: #18181b; color: #fff; }
.pm-btn.primary:hover { background: #27272a; }

/* Toast */
.pm-toasts { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 2000; pointer-events: none; }
.pm-toast { background: #18181b; color: #fafafa; font: 14px var(--font); padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: pm-up .18s ease-out; }
@keyframes pm-up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Printouts: 80 mm thermal paper and a 50 x 30 mm label */
.paper-stage { background: #e9e9ee; border-radius: 10px; padding: 24px; display: flex; justify-content: center; }
.receipt { width: 302px; background: #fff; color: #111; font: 12px/1.45 var(--mono); padding: 16px 14px 22px; box-shadow: 0 2px 10px rgba(0,0,0,.12); position: relative; }
.receipt::after { content: ''; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 33%, #fff 33%, #fff 66%, transparent 66%) 0 0 / 12px 8px, linear-gradient(45deg, transparent 33%, #fff 33%, #fff 66%, transparent 66%) 0 0 / 12px 8px; }
.receipt .c { text-align: center; }
.receipt .big { font-size: 16px; font-weight: 700; font-family: var(--font); }
.receipt .rule { border-top: 1px dashed #777; margin: 8px 0; }
.receipt .row { display: flex; justify-content: space-between; gap: 8px; }
.receipt .muted { color: #555; }
.receipt .tot { font-size: 15px; font-weight: 700; }
.receipt .qr { width: 96px; height: 96px; margin: 8px auto 0; }
.receipt .sig { height: 54px; border-bottom: 1px solid #333; margin-top: 6px; display: flex; align-items: flex-end; }
.receipt .sig img { max-height: 52px; }
.receipt .small { font-size: 10.5px; line-height: 1.4; }
.label { width: 302px; height: 181px; background: #fff; color: #111; border-radius: 6px; padding: 12px 14px; font: 12px var(--font); box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; flex-direction: column; justify-content: space-between; }
.label .l1 { font-weight: 700; font-size: 15px; }
.label .l2 { display: flex; justify-content: space-between; font-size: 12px; }
.label .bc { height: 44px; }
.label .bc svg { width: 100%; height: 100%; }
.label .code { font: 12px var(--mono); text-align: center; letter-spacing: .08em; }

/* Device art */
.dev { display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 35%, #fbfbfd, #eceef2); border-radius: 12px; overflow: hidden; }
.dev svg { height: 86%; width: auto; max-width: 86%; filter: drop-shadow(0 8px 14px rgba(0,0,0,.14)); }

</style>
<style>
/* Storefront — customer-facing site shared by both proposals. */
:root { --ink: #0b0b0f; --ink2: #3f3f46; --muted: #71717a; --line: #e7e5e4; --soft: #f6f5f3; --acc: #ff5a1f; --acc-d: #e64a12; --green: #15803d; --r: 16px; }
body { margin: 0; font: 15px/1.6 var(--font); color: var(--ink); background: #fff; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Header */
.promo { background: var(--ink); color: #fff; font-size: 13.5px; text-align: center; padding: 8px 12px; }
.promo b { color: #ffb08f; }
.hdr { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.hdr-in { display: flex; align-items: center; gap: 28px; height: 68px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
.logo i { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #ff6a2b, #ff3d6e); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 18px; }
.logo small { font-size: 11px; letter-spacing: .18em; color: var(--muted); font-weight: 600; display: block; line-height: 1; margin-top: 2px; }
.mainnav { display: flex; gap: 22px; font-weight: 500; overflow-x: auto; }
.mainnav a { padding: 6px 0; white-space: nowrap; color: var(--ink2); }
.mainnav a:hover, .mainnav a.on { color: var(--ink); }
.mainnav a.hl { color: var(--acc); font-weight: 700; }
.hdr-r { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--ink2); }
.hdr-r .lang b { color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 600; white-space: nowrap; }
.pill.wa { background: #25d366; border-color: #25d366; color: #fff; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-weight: 700; white-space: nowrap; }
.btn:hover { background: #26262b; }
.btn.acc { background: var(--acc); border-color: var(--acc); }
.btn.acc:hover { background: var(--acc-d); }
.btn.line { background: #fff; color: var(--ink); border-color: #d6d3d1; }
.btn.line:hover { background: var(--soft); }
.btn.ghost-w { background: transparent; border-color: rgba(255,255,255,.4); color: #fff; }
.btn.sm { height: 38px; padding: 0 16px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

/* Hero */
.hero { background: radial-gradient(1200px 500px at 85% 20%, #3b1d10 0%, transparent 60%), linear-gradient(160deg, #0b0b0f 0%, #17171d 60%, #221510 100%); color: #fff; overflow: hidden; }
.hero-in { display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: 40px; padding: 72px 24px 64px; }
.kicker { display: inline-flex; gap: 8px; align-items: center; font-size: 13.5px; font-weight: 600; color: #ffb08f; background: rgba(255,90,31,.12); border: 1px solid rgba(255,90,31,.35); border-radius: 999px; padding: 5px 12px; }
.hero h1 { font-size: 52px; line-height: 1.12; letter-spacing: -.02em; margin: 18px 0 14px; }
.hero p { font-size: 18px; color: #d4d4d8; margin: 0 0 28px; max-width: 520px; }
.hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; }
.hero .proof { display: flex; gap: 26px; margin-top: 34px; color: #a1a1aa; font-size: 14px; }
.hero .proof b { display: block; color: #fff; font-size: 22px; }
.collage { position: relative; height: 380px; }
.collage .p { position: absolute; width: 170px; height: 340px; filter: drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
.collage .p svg { width: 100%; height: 100%; }
.collage .p1 { left: 8%; top: 30px; transform: rotate(-10deg); }
.collage .p2 { left: 36%; top: 0; z-index: 2; }
.collage .p3 { left: 64%; top: 40px; transform: rotate(9deg); }

/* Sections */
.sec { padding: 64px 0; }
.sec.soft { background: var(--soft); }
.sec-hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
.sec-hd h2 { font-size: 30px; margin: 0; letter-spacing: -.01em; }
.sec-hd p { margin: 6px 0 0; color: var(--muted); }
.sec-hd a { font-weight: 600; white-space: nowrap; }
.usp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.usp div { display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.usp .ic { width: 26px; height: 26px; color: var(--acc); margin-top: 2px; }
.usp b { display: block; }
.usp span { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.cat { background: var(--soft); border-radius: var(--r); padding: 18px 18px 0; display: flex; flex-direction: column; overflow: hidden; transition: transform .15s; }
.cat:hover { transform: translateY(-3px); }
.cat b { font-size: 18px; }
.cat span { color: var(--muted); font-size: 13.5px; }
.cat .dev { height: 150px; background: none; margin-top: 10px; }

/* Product cards */
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.pc { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: #fff; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
.pc:hover { box-shadow: 0 12px 30px rgba(0,0,0,.08); transform: translateY(-2px); }
.pc .dev { height: 230px; border-radius: 0; position: relative; }
.pc .badges { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; }
.pc .bd { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.pc .nm { font-weight: 700; line-height: 1.35; }
.pc .meta { color: var(--muted); font-size: 13.5px; }
.pc .pr { display: flex; align-items: baseline; justify-content: space-between; margin-top: auto; padding-top: 6px; }
.pc .pr b { font-size: 20px; }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: #fff; border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.tag.g { background: #f0fdf4; border-color: #bbf7d0; color: var(--green); }
.tag.a { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
.tag.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.swatches { display: flex; gap: 5px; }
.swatches i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); display: inline-block; }

/* Sell band */
.band { background: linear-gradient(120deg, #ff5a1f, #ff2d6b); color: #fff; border-radius: 24px; padding: 40px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center; }
.band h2 { font-size: 32px; margin: 0 0 8px; }
.band p { margin: 0; opacity: .92; }
.qq { background: #fff; color: var(--ink); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.qq select { height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.qq .q { font-size: 14px; color: var(--muted); }
.qq .q b { color: var(--ink); font-size: 26px; display: block; }

.grades { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.grades div { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: #fff; }
.grades b { font-size: 20px; display: block; }
.grades span { color: var(--muted); font-size: 13.5px; }
.store { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; align-items: stretch; }
.store .info { border: 1px solid var(--line); border-radius: var(--r); padding: 24px; line-height: 2; }
.map { border-radius: var(--r); background: repeating-linear-gradient(45deg, #f1f1ef 0 12px, #ebebe8 12px 24px); display: grid; place-items: center; color: var(--muted); min-height: 220px; }

/* Listing page */
.crumb { color: var(--muted); font-size: 14px; padding: 22px 0 6px; }
.crumb a:hover { color: var(--ink); }
.list-hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 4px 0 22px; flex-wrap: wrap; }
.list-hd h1 { margin: 0; font-size: 34px; letter-spacing: -.01em; }
.list-hd p { margin: 4px 0 0; color: var(--muted); }
.list { display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: start; padding-bottom: 64px; }
.filters { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 22px; }
.filters h4 { margin: 0 0 8px; font-size: 14px; }
.filters label { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; cursor: pointer; }
.filters label span { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 4px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.sort { height: 40px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; background: #fff; }

/* Product page */
.pdp { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; padding: 10px 0 64px; align-items: start; }
.gallery .main { height: 520px; border-radius: 22px; }
.gallery .thumbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 12px; }
.gallery .thumbs button { border: 2px solid transparent; border-radius: 12px; padding: 0; background: none; height: 74px; overflow: hidden; }
.gallery .thumbs button.on { border-color: var(--ink); }
.gallery .thumbs .dev { height: 100%; border-radius: 10px; }
.gallery .real { font-size: 13px; color: var(--muted); margin-top: 10px; display: flex; gap: 6px; align-items: center; }
.buy h1 { font-size: 32px; margin: 0; letter-spacing: -.01em; line-height: 1.2; }
.buy .price { font-size: 34px; font-weight: 800; margin: 14px 0 4px; letter-spacing: -.02em; }
.buy .price small { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 8px; text-decoration: line-through; }
.opt { margin-top: 22px; }
.opt h4 { margin: 0 0 10px; font-size: 14px; display: flex; justify-content: space-between; }
.opt h4 span { color: var(--muted); font-weight: 500; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.ch { min-width: 74px; height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.ch.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.ch[disabled] { color: #c4c4c8; background: #fafafa; text-decoration: line-through; cursor: not-allowed; }
.ch i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); }
.units { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 10px; }
.unit { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.unit:first-child { border-top: 0; }
.unit.on { background: #fff7f2; }
.unit .rad { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #d4d4d8; }
.unit.on .rad { border: 6px solid var(--acc); }
.unit b { font-size: 16px; }
.unit .m { font-size: 13px; color: var(--muted); }
.ctas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.trust { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.trust div { display: flex; gap: 10px; align-items: center; font-size: 14px; background: var(--soft); border-radius: 12px; padding: 12px; }
.trust .ic { color: var(--green); }
details { border-top: 1px solid var(--line); padding: 14px 0; }
details summary { font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
details summary::after { content: '+'; font-size: 20px; line-height: 1; color: var(--muted); }
details[open] summary::after { content: '–'; }
.chkgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 14px; margin-top: 12px; font-size: 14px; }
.chkgrid span { display: flex; gap: 6px; align-items: center; }
.chkgrid .ic { width: 16px; height: 16px; color: var(--green); }

/* Sell and repair flows */
.flow { max-width: 900px; margin: 0 auto; padding: 10px 24px 72px; }
.flow h1 { font-size: 38px; margin: 6px 0 6px; letter-spacing: -.01em; }
.flow .lead { color: var(--muted); margin: 0 0 26px; font-size: 17px; }
.stepbox { border: 1px solid var(--line); border-radius: 20px; padding: 24px; margin-bottom: 16px; }
.stepbox h3 { margin: 0 0 14px; font-size: 18px; display: flex; gap: 10px; align-items: center; }
.stepbox h3 .n { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 14px; }
.stepbox.done h3 .n { background: var(--green); }
.stepbox.wait { opacity: .45; }
.models { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mdl { border: 1.5px solid var(--line); border-radius: 14px; background: #fff; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; text-align: center; }
.mdl .dev { height: 90px; width: 100%; background: none; }
.mdl.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.qs { display: flex; flex-direction: column; gap: 16px; }
.qrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.qrow b { font-weight: 600; }
.result { background: var(--ink); color: #fff; border-radius: 20px; padding: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
.result .amt { font-size: 44px; font-weight: 800; letter-spacing: -.02em; }
.result .amt small { font-size: 16px; color: #a1a1aa; font-weight: 500; display: block; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form input, .form select { height: 48px; border: 1px solid #d6d3d1; border-radius: 12px; padding: 0 14px; background: #fff; color: var(--ink); width: 100%; }
.result .form input, .result .form select { border-color: #3f3f46; }
.ok-box { text-align: center; padding: 30px; border: 1px solid var(--line); border-radius: 20px; }
.ok-box .ic { width: 56px; height: 56px; color: var(--green); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th, .tbl td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--muted); font-weight: 600; font-size: 13px; }
.tbl td.r, .tbl th.r { text-align: right; }

/* Page */
.page { max-width: 760px; margin: 0 auto; padding: 10px 24px 80px; }
.page h1 { font-size: 38px; margin: 6px 0 4px; }
.page .upd { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
.page p { font-size: 17px; line-height: 1.85; }

/* Footer */
.ftr { background: var(--ink); color: #a1a1aa; padding: 48px 0 28px; font-size: 14px; }
.ftr-in { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 28px; }
.ftr b { color: #fff; display: block; margin-bottom: 10px; }
.ftr a { display: block; padding: 3px 0; }
.ftr a:hover { color: #fff; }
.ftr .bottom { border-top: 1px solid #27272a; margin-top: 30px; padding-top: 18px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.demo { position: fixed; left: 14px; bottom: 14px; z-index: 50; background: rgba(11,11,15,.88); color: #fff; font-size: 12.5px; border-radius: 999px; padding: 6px 12px; }
.demo a { color: #ffb08f; margin-left: 8px; }

/* Reserve modal content */
.rv { display: flex; flex-direction: column; gap: 14px; }
.rv .sumline { display: flex; gap: 12px; align-items: center; background: var(--soft); border-radius: 12px; padding: 10px; }
.rv .sumline .dev { width: 64px; height: 64px; border-radius: 10px; flex: none; }
.rv .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rv .opts button { height: 46px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-weight: 600; }
.rv .opts button.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

  const PHOTO_VIEWS = ['back', 'front', 'tilt', 'detail', 'back', 'front'];
  const photoSVG = (u, i) => deviceSVG(u.model, u.hex, PHOTO_VIEWS[i % PHOTO_VIEWS.length]);

  // ---------- QR and barcode art (look-alikes, not scannable) ----------
  function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function qrSVG(text) {
    const n = 25; let h = hash(text) || 1; let cells = '';
    const inFinder = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (inFinder(x, y)) continue;
      h = (Math.imul(h, 1103515245) + 12345) >>> 0;
      if ((h >>> 16) % 2 === 0) cells += `M${x} ${y}h1v1h-1z`;
    }
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#000"/>`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${cells}" fill="#000"/>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
  }
  function barcodeSVG(text) {
    let bits = '11010010000';
    for (const c of String(text)) bits += (hash(c + text.length) >>> 3).toString(2).padStart(11, '0').slice(-11) + '0';
    bits += '1100011101011';
    let x = 0, d = '';
    for (const b of bits) { if (b === '1') d += `M${x} 0h1v40h-1z`; x++; }
    return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
  }

  // ---------- toast ----------
  function toast(msg) {
    let box = $('.pm-toasts');
    if (!box) { box = document.createElement('div'); box.className = 'pm-toasts'; document.body.appendChild(box); }
    const t = document.createElement('div');
    t.className = 'pm-toast';
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 2800);
  }

  // ---------- modal ----------
  function modal({ title, body, foot, width, onClose }) {
    const ov = document.createElement('div');
    ov.className = 'pm-overlay';
    ov.innerHTML = `<div class="pm-modal" style="max-width:${width || 560}px" role="dialog" aria-modal="true"><div class="pm-modal-head"><span>${title || ''}</span><button type="button" data-close aria-label="關閉">×</button></div><div class="pm-modal-body">${body || ''}</div>${foot ? `<div class="pm-modal-foot">${foot}</div>` : ''}</div>`;
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); if (onClose) onClose(); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
    ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    return { el: ov.querySelector('.pm-modal'), close };
  }

  function printPreview(html, opts) {
    opts = opts || {};
    const m = modal({
      title: opts.title || '列印預覽',
      width: opts.width || 440,
      body: `<div class="paper-stage">${html}</div><p style="margin:12px 0 0;color:#71717a;font-size:13px">${opts.hint || '一按即印：經打印代理直接送到收據打印機，唔使揀打印機。'}</p>`,
      foot: `<button type="button" class="pm-btn" data-close>關閉</button><button type="button" class="pm-btn primary" data-print>列印</button>`,
    });
    m.el.querySelector('[data-print]').addEventListener('click', () => { m.close(); toast(opts.sent || '已送到收據打印機（示範）'); });
    return m;
  }

  // ---------- printouts ----------
  const STORE = () => PM.store.get().cms.store;
  const head = sub => `<div class="c big">手機俠 Phonemen</div><div class="c muted">${esc(STORE().address)}</div><div class="c muted">WhatsApp ${esc(STORE().whatsapp)}</div>${sub ? `<div class="c" style="margin-top:6px;font-weight:700">${sub}</div>` : ''}<div class="rule"></div>`;
  const row = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`;
  const plusMonths = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCMonth(t.getUTCMonth() + n); return t.toISOString().slice(0, 10); };

  function receiptSale(d) {
    const lines = d.lines.map(l => `<div style="margin-top:4px">${esc(l.title)}</div><div class="row muted"><span>${esc(l.code)} · ${esc(l.grade)}${l.battery ? ' · 電池 ' + l.battery + '%' : ''}</span></div><div class="row muted"><span>${l.imei ? (l.imei.length === 15 ? 'IMEI ' : '序號 ') + esc(l.imei) : ''}</span><span>${hkd(l.price)}</span></div>`).join('');
    const pays = (d.payments || []).map(p => row(esc(p.method), hkd(p.amount))).join('');
    return `<div class="receipt">${head('發票 / 收據')}${row('單號', esc(d.no))}${row('日期', esc(d.date))}${row('店員', esc(d.staff) + ' · ' + esc(d.channel))}${d.customer ? row('客戶', esc(d.customer.name) + ' ' + maskPhone(d.customer.phone)) : ''}<div class="rule"></div>${lines}<div class="rule"></div>${d.discount ? row('折扣', '-' + hkd(d.discount)) : ''}${pays}<div class="row tot"><span>合共</span><span>${hkd(d.total)}</span></div><div class="rule"></div><div class="small">保養至 ${plusMonths(d.date.slice(0, 10), 3)}（3 個月；人為損壞及入水除外）。請保留此收據。</div><div class="qr">${qrSVG(d.no)}</div><div class="c small">掃描查看保養及裝置檔案</div><div class="c" style="margin-top:6px">多謝惠顧！</div></div>`;
  }

  function slipBuyback(d) {
    const fails = (d.faults || []).length ? d.faults.map(PM.checkName).join('、') : '全部合格';
    return `<div class="receipt">${head('二手機回收單')}${row('單號', esc(d.no))}${row('日期', esc(d.date))}${row('店員', esc(d.staff))}<div class="rule"></div>${row('賣方', esc(d.name))}${row('電話', maskPhone(d.phone))}${d.idno ? row('證件', esc(d.idno)) : ''}<div class="rule"></div><div>${esc(d.title)}</div>${row(d.imei && d.imei.length === 15 ? 'IMEI' : '序號', esc(d.imei))}${row('成色 / 電池', esc(d.grade) + ' / ' + d.battery + '%')}${row('17 點檢查', esc(fails))}<div class="rule"></div>${row('付款方式', esc(d.pay))}<div class="row tot"><span>回收價</span><span>${hkd(d.price)}</span></div><div class="rule"></div><div class="small">本人確認上述裝置為本人合法擁有，並無任何借貸、按揭或盜竊來源，已關閉「尋找」功能及登出帳戶，並同意以上價錢出售予手機俠。</div><div class="small" style="margin-top:8px">賣方簽署</div><div class="sig">${d.signature ? `<img alt="簽署" src="${d.signature}">` : ''}</div><div class="c small" style="margin-top:8px">個人資料只用於交易紀錄，按《個人資料（私隱）條例》處理。</div></div>`;
  }

  function ticketRepair(d) {
    return `<div class="receipt">${head('維修單')}${row('單號', esc(d.no))}${row('收機日期', esc(d.date))}${row('客戶', esc(d.name) + ' ' + maskPhone(d.phone))}<div class="rule"></div><div>${esc(d.device)} ${esc(d.color || '')}</div>${row('IMEI / 序號', esc(d.imei || '-'))}<div class="small" style="margin:4px 0">問題：${esc(d.issue)}</div><div class="rule"></div>${row('報價', d.quote ? hkd(d.quote) : '待檢查')}${row('訂金', hkd(d.deposit || 0))}${row('預計取機', esc(d.eta))}<div class="rule"></div><div class="small">取機時請出示此單。維修部分保養 30 日。機主確認已備份資料。</div><div class="qr">${qrSVG(d.no)}</div><div class="c small">掃描查看維修進度</div></div>`;
  }

  function label(u) {
    const m = PM.modelOf(u.model);
    return `<div class="label"><div><div class="l1">${esc(m.name)} ${esc(u.cap)}</div><div class="l2"><span>${esc(u.color)} · ${esc(u.grade)}${u.battery ? ' · 電池 ' + u.battery + '%' : ''}</span></div></div><div class="bc">${barcodeSVG(u.code)}</div><div class="l2"><span class="code">${esc(u.code)}</span><b>${hkd(u.price)}</b></div></div>`;
  }

  // ---------- signature pad ----------
  function signaturePad(canvas) {
    const ctx = canvas.getContext('2d');
    let drawing = false, empty = true, last = null;
    const pos = e => { const r = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return [(p.clientX - r.left) * canvas.width / r.width, (p.clientY - r.top) * canvas.height / r.height]; };
    const start = e => { drawing = true; last = pos(e); e.preventDefault(); };
    const move = e => { if (!drawing) return; const p = pos(e); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; empty = false; e.preventDefault(); };
    const end = () => { drawing = false; };
    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end);
    return {
      clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); empty = true; },
      isEmpty: () => empty,
      toDataURL: () => canvas.toDataURL('image/png'),
      demo() { this.clear(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); const w = canvas.width, h = canvas.height; ctx.moveTo(w * .12, h * .62); for (let i = 0; i <= 40; i++) { const x = w * (.12 + i * .018); ctx.lineTo(x, h * (.55 + Math.sin(i * .7) * .18 - i * .002)); } ctx.stroke(); empty = false; },
    };
  }

  // Links between the mockups. The single-file bundles (dist/) override these paths.
  const LINKS = Object.assign({ hub: '../', a: '../a/', b: '../b/', shop: '../shop/' }, window.PM_LINKS || {});
  const link = (app, hash) => LINKS[app] + (hash || '');
  const shopURL = hash => link('shop', hash);

  const STATUS = {
    qc: { label: '待QC', tone: 'amber' },
    refurb: { label: '翻新中', tone: 'orange' },
    ready: { label: '可上架', tone: 'sky' },
    listed: { label: '已上架', tone: 'green' },
    reserved: { label: '已預留', tone: 'violet' },
    sold: { label: '已售', tone: 'slate' },
  };

  window.UI = { esc, $, $$, now, hkd, maskPhone, shade, lum, deviceSVG, photoSVG, qrSVG, barcodeSVG, toast, modal, printPreview, receiptSale, slipBuyback, ticketRepair, label, signaturePad, STATUS, plusMonths, link, shopURL };
})();

<script>
/* Storefront — every Listed unit shows up automatically. Reservations, trade-in quotes
   and repair bookings go straight into the shared backend data. */
(function () {
  'use strict';
  const { store, hkd, modelOf, TODAY } = PM;
  const { esc, $, $$, toast } = UI;
  const S = () => store.get();
  const nospace = p => String(p || '').replace(/\s/g, '');
  const fmtPhone = p => { const d = nospace(p); return /^\d{8}$/.test(d) ? d.slice(0, 4) + ' ' + d.slice(4) : d; };

  const P = {
    check: 'M20 6L9 17l-5-5',
    shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
    store: 'M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
    card: 'M3 6h18v12H3zM3 10h18M7 15h4',
    arrow: 'M5 12h14M13 6l6 6-6 6',
    msg: 'M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z',
    camera: 'M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z',
    spark: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z',
    clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
  };
  const ic = (n, st) => `<svg class="ic" viewBox="0 0 24 24"${st ? ` style="${st}"` : ''}><path d="${P[n]}"/></svg>`;
  const live = () => S().units.filter(u => u.status === 'listed');
  const famById = id => PM.FAMILIES.find(f => f.id === id) || PM.FAMILIES[0];
  const famOfModel = m => PM.FAMILIES.find(f => f.family === m.family);
  const gradeTag = g => `<span class="tag ${g.startsWith('A') ? 'dark' : ''}">${esc(g)}</span>`;
  const battTag = b => `<span class="tag ${b >= 85 ? 'g' : 'a'}">電池 ${b}%</span>`;
  const plainTitle = m => m.name.replace(' Wi-Fi', '');
  // Saves made here re-render explicitly; changes from the backend tab re-render through the listener.
  let muted = false;
  const commit = () => { muted = true; store.save(); muted = false; };

  // ---------------------------------------------------------------- routing
  let fallback = null;
  const current = () => fallback || (location.hash || '#/').slice(1) || '/';
  function go(path) {
    if (current() === path) { route(); return; }
    try { location.hash = path; } catch (e) { /* ignore */ }
    if (location.hash !== '#' + path) { fallback = path; route(); }
  }
  window.__go = go;
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    e.preventDefault();
    go(a.getAttribute('href').slice(1));
  });
  window.addEventListener('hashchange', () => { fallback = null; route(); });

  function route() {
    const [path, qs] = current().split('?');
    const q = new URLSearchParams(qs || '');
    const parts = path.split('/').filter(Boolean);
    renderChrome(parts[0] === 'c' ? parts[1] : parts[0] === 'p' ? famOfModel(PM.modelBySlug(parts[1]) || PM.MODELS[0]).id : parts[0]);
    const el = document.createElement('div');
    $('#app').replaceChildren(el);
    window.scrollTo(0, 0);
    if (!parts.length) home(el);
    else if (parts[0] === 'c') category(el, parts[1] || 'iphone');
    else if (parts[0] === 'p') product(el, parts[1], q);
    else if (parts[0] === 'sell') sell(el, q);
    else if (parts[0] === 'repair') repair(el);
    else if (parts[0] === 'page') page(el, parts[1]);
    else home(el);
  }

  function renderChrome(active) {
    const cms = S().cms;
    const banner = cms.banners.find(b => b.on);
    $('#promo').innerHTML = banner ? `<b>${esc(banner.title)}</b>　·　${esc(banner.from)} 至 ${esc(banner.to)}　<a href="#/c/iphone" style="text-decoration:underline">立即睇</a>` : `<b>${esc(cms.hero.kicker)}</b>`;
    $('#mainnav').innerHTML = PM.FAMILIES.map(f => `<a href="#/c/${f.id}" class="${active === f.id ? 'on' : ''}">${f.name}</a>`).join('') + `<a href="#/sell" class="hl ${active === 'sell' ? 'on' : ''}">回收報價</a><a href="#/repair" class="${active === 'repair' ? 'on' : ''}">維修</a>`;
    const st = cms.store;
    $('#footer').innerHTML = `<div class="wrap"><div class="ftr-in">
      <div><b>${esc(st.name)}</b>${esc(st.address)}<br>${esc(st.hours)}<br>WhatsApp ${esc(st.whatsapp)}</div>
      <div><b>買機</b>${PM.FAMILIES.map(f => `<a href="#/c/${f.id}">二手 ${f.name}</a>`).join('')}</div>
      <div><b>服務</b><a href="#/sell">即時回收報價</a><a href="#/repair">維修預約</a><a href="#/page/warranty">保養條款</a><a href="#/page/how-to-sell">回收流程</a></div>
      <div><b>關於</b>${cms.pages.filter(p => p.status === '已發佈').map(p => `<a href="#/page/${p.slug}">${esc(p.title)}</a>`).join('')}</div>
    </div><div class="bottom"><span>© 2026 手機俠有限公司 · 示範網站</span><span>付款：轉數快 FPS · 信用卡 · 門市現金</span></div></div>`;
  }

  // ---------------------------------------------------------------- cards
  function unitCard(u) {
    const m = modelOf(u.model);
    return `<a class="pc" href="#/p/${m.slug}?u=${u.code}"><div class="dev">${UI.photoSVG(u, 0)}<div class="badges">${gradeTag(u.grade)}${battTag(u.battery)}</div></div>
      <div class="bd"><div class="nm">${esc(plainTitle(m))} ${esc(u.cap)}</div><div class="meta">${esc(u.color)} · ${PM.REGIONS[u.region]} · ${u.photos} 張實拍</div><div class="pr"><b>${hkd(u.price)}</b><span class="meta">${ic('check', 'width:15px;height:15px;color:#15803d;vertical-align:-3px')} 17 點檢查</span></div></div></a>`;
  }
  function modelCard(m, units) {
    const min = Math.min(...units.map(u => u.price));
    const hexes = [...new Set(units.map(u => u.hex))];
    const caps = [...new Set(units.map(u => u.cap))];
    const grades = [...new Set(units.map(u => u.grade))].sort();
    return `<a class="pc" href="#/p/${m.slug}"><div class="dev">${UI.deviceSVG(m.id, units[0].hex, 'back')}<div class="badges"><span class="tag">${units.length} 部現貨</span></div></div>
      <div class="bd"><div class="nm">${esc(plainTitle(m))}</div><div class="meta">${caps.join(' / ')} · 成色 ${grades.join(' ')}</div><div class="swatches">${hexes.map(h => `<i style="background:${h}"></i>`).join('')}</div><div class="pr"><b>${hkd(min)} 起</b></div></div></a>`;
  }

  // ---------------------------------------------------------------- home (blocks come from the CMS)
  function home(el) {
    const s = S();
    const cms = s.cms;
    const hidden = cms.hidden || [];
    const L = live().sort((a, b) => b.bought.localeCompare(a.bought) || b.code.localeCompare(a.code));
    const BLK = {
      hero: () => {
        const p1 = L.find(u => modelOf(u.model).family === 'iPhone' && modelOf(u.model).pro);
        const p2 = L.find(u => modelOf(u.model).family === 'iPhone' && u !== p1 && u.hex !== (p1 || {}).hex);
        const pick = [p1, p2, L.find(u => u !== p1 && u !== p2)].filter(Boolean);
        return `<section class="hero"><div class="wrap hero-in"><div>
          <span class="kicker">${ic('shield', 'width:16px;height:16px')} ${esc(cms.hero.kicker)}</span>
          <h1>${esc(cms.hero.title)}</h1><p>${esc(cms.hero.sub)}</p>
          <div class="ctas"><a class="btn acc" href="#/c/iphone">${esc(cms.hero.cta1)} ${ic('arrow')}</a><a class="btn ghost-w" href="#/sell">${esc(cms.hero.cta2)}</a></div>
          <div class="proof"><span><b>${L.length}</b>部現貨</span><span><b>17 點</b>出廠檢查</span><span><b>3 個月</b>保養</span></div></div>
          <div class="collage">${pick.map((u, i) => `<div class="p p${i + 1}">${UI.deviceSVG(u.model, u.hex, i === 1 ? 'front' : 'back')}</div>`).join('')}</div></div></section>`;
      },
      usp: () => `<section class="sec" style="padding:28px 0"><div class="wrap usp">
        <div>${ic('shield')}<span><b>17 點檢查</b>每部機上架前都經過測試，紀錄睇得到</span></div>
        <div>${ic('camera')}<span><b>實拍相片</b>你睇到嘅就係你攞到嘅嗰一部</span></div>
        <div>${ic('store')}<span><b>門市取機</b>網上預留，到旺角門市試機再付款</span></div>
        <div>${ic('card')}<span><b>轉數快 · 信用卡</b>預留只需 HK$200 訂金</span></div></div></section>`,

            <div class="real">${ic('camera', 'width:16px;height:16px')} 實拍相片 · 編號 ${sel.code} 呢一部</div></div>

            <div class="price">${hkd(sel.price)}</div>
            <div style="color:var(--muted);font-size:14px">或預留只需 HK$200 訂金 · 門市試機滿意先付餘數</div>
            <div class="opt"><h4>容量</h4><div class="chips">${Object.keys(m.base).map(c => `<button type="button" class="ch ${c === sel.cap ? 'on' : ''}" data-cap="${c}"${capOK(c) ? '' : ' disabled'}>${c}</button>`).join('')}</div></div>

      photo = 0;
      draw();
    };
    el.addEventListener('click', e => {
      const t = e.target.closest('[data-ph],[data-cap],[data-color],[data-grade],[data-unit],[data-act]');

      else if (t.dataset.cap) pick(t.dataset.cap, sel.color, sel.grade);
      else if (t.dataset.color) { const pool = units.filter(u => u.color === t.dataset.color); const cap = pool.some(u => u.cap === sel.cap) ? sel.cap : (pool[0] || sel).cap; pick(cap, t.dataset.color, sel.grade); }
      else if (t.dataset.grade) pick(sel.cap, sel.color, t.dataset.grade);
      else if (t.dataset.unit) { sel = units.find(u => u.code === t.dataset.unit); photo = 0; draw(); }
      else if (t.dataset.act === 'reserve' || t.dataset.act === 'buy') reserveModal(sel, t.dataset.act === 'buy', () => { units = live().filter(u => u.model === m.id); sel = units[0] || null; draw(); });

        <div class="fps" id="rv-paybox"><div>${UI.qrSVG('fps-' + u.code)}</div><div>用銀行 App 掃描轉數快 QR<br><b style="font-size:24px">${hkd(amount)}</b><br><span style="font-size:13px;color:#71717a">${full ? '全數付款' : '訂金，餘數取機時付'}</span></div></div>
        <div style="font-size:13px;color:#71717a">${full ? '付款後我哋會 WhatsApp 確認取機或寄送時間。' : '預留 48 小時；逾時未取機，訂金全數退回。'}</div></div>`,
      foot: `<button class="pm-btn" data-close>取消</button><button class="pm-btn primary" data-ok>我已付款，確認${full ? '購買' : '預留'}</button>`,
    });

    });
    $('[data-ok]', md.el).addEventListener('click', () => {

      PM.upsertCustomer(phone, name);
      unit.status = 'reserved';
      unit.reserved = { by: phone, deposit: amount, channel: '網店', date: TODAY, pickup: st.pick, paid: full };

  // ---------------------------------------------------------------- trade-in quote
  const LOOKS = [['A★★★', '近全新', '冇花冇痕'], ['A', '輕微使用痕', '近睇先見細花'], ['B', '明顯花痕', '一眼睇到花痕'], ['C', '有撞痕', '邊框有撞或凹']];
  const sl = { fam: 'iPhone', mid: '', cap: '', power: 'yes', screen: 'ok', faceid: 'ok', batt: '85', look: 'A', done: null };
  function sell(el, q) {
    if (q.get('m') && q.get('m') !== sl.mid) { const m = modelOf(q.get('m')); if (m) Object.assign(sl, { fam: m.family, mid: m.id, cap: '', done: null }); }
    const draw = () => {
      const fams = [...new Set(PM.MODELS.map(m => m.family))];
      const m = sl.mid ? modelOf(sl.mid) : null;
      const caps = m ? Object.keys(m.base) : [];
      if (m && !caps.includes(sl.cap)) sl.cap = caps.length === 1 ? caps[0] : '';
      const ready = m && sl.cap;
      const faults = [];
      if (sl.screen === 'cracked') faults.push('screen');
      if (sl.faceid === 'bad') faults.push('faceid');
      const batt = sl.batt === '85' ? 90 : sl.batt === '80' ? 82 : 76;
      const qq = ready ? PM.buyQuote(sl.mid, sl.cap, sl.look, batt, faults) : null;
      const hi = qq ? qq.total : 0;
      const lo = PM.r10(hi * 0.93);
      const yes = (k, a, b, la, lb) => `<div class="seg"><button data-k="${k}" data-v="${a}" class="${sl[k] === a ? 'on' : ''}">${la}</button><button data-k="${k}" data-v="${b}" class="${sl[k] === b ? 'on' : ''}">${lb}</button></div>`;
      if (sl.done) {
        el.innerHTML = `<div class="flow"><div class="crumb"><a href="#/">首頁</a> / 回收報價</div><div class="ok-box">${ic('check')}<h2>收到！報價編號 ${sl.done.id}</h2><p>${esc(sl.done.name)}，我哋會喺 1 小時內 WhatsApp ${esc(sl.done.phone)} 確認到店時間。<br>預計回收價 <b>${hkd(sl.done.lo)} – ${hkd(sl.done.hi)}</b>，最終以門市檢查為準。</p><p style="color:var(--muted)">記得帶身份證明文件，並先關閉「尋找」功能。</p><a class="btn" href="#/" style="margin-top:8px">返回首頁</a> <button class="btn line" data-again>再報一部</button></div></div>`;
        return;
      }
      el.innerHTML = `<div class="flow"><div class="crumb"><a href="#/">首頁</a> / 回收報價</div><h1>即時回收報價</h1><p class="lead">三步睇到價。到門市 10 分鐘檢查，即場現金或轉數快過數。</p>
        <div class="stepbox ${m ? 'done' : ''}"><h3><span class="n">1</span>揀型號</h3><div class="seg" style="margin-bottom:14px">${fams.map(f => `<button data-fam="${f}" class="${sl.fam === f ? 'on' : ''}">${f}</button>`).join('')}</div><div class="models">${PM.MODELS.filter(x => x.family === sl.fam).map(x => `<button type="button" class="mdl ${x.id === sl.mid ? 'on' : ''}" data-mid="${x.id}"><div class="dev">${UI.deviceSVG(x.id, x.colors[0][1], 'back')}</div>${esc(plainTitle(x))}</button>`).join('')}</div></div>
        <div class="stepbox ${!m ? 'wait' : sl.cap ? 'done' : ''}"><h3><span class="n">2</span>容量</h3><div class="chips">${caps.map(c => `<button type="button" class="ch ${c === sl.cap ? 'on' : ''}" data-cap="${c}">${c}</button>`).join('') || '<span style="color:var(--muted)">先揀型號</span>'}</div></div>
        <div class="stepbox ${ready ? '' : 'wait'}"><h3><span class="n">3</span>狀況</h3><div class="qs">
          <div class="qrow"><b>可以正常開機？</b>${yes('power', 'yes', 'no', '可以', '唔可以')}</div>
          <div class="qrow"><b>熒幕有冇裂？</b>${yes('screen', 'ok', 'cracked', '冇裂', '有裂')}</div>
          <div class="qrow"><b>Face ID / Touch ID 正常？</b>${yes('faceid', 'ok', 'bad', '正常', '唔正常')}</div>
          <div class="qrow"><b>電池健康度</b><div class="seg">${[['85', '85% 或以上'], ['80', '80–84%'], ['79', '79% 或以下']].map(([v, l]) => `<button data-k="batt" data-v="${v}" class="${sl.batt === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>
          <div class="qrow" style="align-items:flex-start"><b>外觀</b><div class="chips">${LOOKS.map(([g, n, d]) => `<button type="button" class="ch ${sl.look === g ? 'on' : ''}" data-k="look" data-v="${g}" style="flex-direction:column;height:auto;padding:8px 14px;align-items:flex-start"><span>${n}</span><span style="font-size:12px;color:var(--muted);font-weight:500">${d}</span></button>`).join('')}</div></div>
        </div></div>
        ${ready ? (sl.power === 'no' ? `<div class="stepbox"><h3>未能開機嘅裝置</h3><p>需要到門市檢查先可以報價。可以直接 WhatsApp 我哋或者預約維修。</p><a class="btn" href="#/repair">預約檢查</a></div>` : `<div class="result"><div><div class="amt"><small>預計回收價</small>${hkd(lo)} – ${hkd(hi)}</div><p style="color:#a1a1aa;margin:8px 0 0">${esc(plainTitle(m))} ${esc(sl.cap)} · ${LOOKS.find(l => l[0] === sl.look)[1]}${faults.length ? ' · ' + faults.map(PM.checkName).join('、') + '有問題' : ''}。最終價錢以門市 17 點檢查為準。</p></div>
          <div class="form"><input id="sl-name" placeholder="姓名"><input id="sl-phone" placeholder="WhatsApp 電話" inputmode="tel"><select id="sl-day"><option>今日</option><option>明日</option><option>後日</option></select><select id="sl-time"><option>12:00–15:00</option><option>15:00–18:00</option><option>18:00–21:00</option></select><button class="btn acc" data-submit style="grid-column:1/-1">預約到店 · 鎖定報價 48 小時</button></div></div>`) : ''}
        <div style="margin-top:40px"><h3>回收價目表（A 級，示範）</h3><table class="tbl"><thead><tr><th>型號</th><th>容量</th><th class="r">A★★★</th><th class="r">A</th><th class="r">B</th></tr></thead><tbody>${PM.MODELS.filter(x => x.family === 'iPhone').map(x => { const cap = Object.keys(x.base)[0]; const a = PM.buyBase(x.id, cap); return `<tr><td>${esc(x.name)}</td><td>${cap}</td><td class="r">${hkd(PM.r10(a * PM.BUY_MULT['A★★★']))}</td><td class="r">${hkd(a)}</td><td class="r">${hkd(PM.r10(a * PM.BUY_MULT.B))}</td></tr>`; }).join('')}</tbody></table></div>
      </div>`;
    };
    el.addEventListener('click', e => {
      const t = e.target.closest('[data-fam],[data-mid],[data-cap],[data-k],[data-submit],[data-again]');
      if (!t) return;
      if (t.dataset.fam) { sl.fam = t.dataset.fam; sl.mid = ''; sl.cap = ''; }
      else if (t.dataset.mid) { sl.mid = t.dataset.mid; sl.cap = ''; }
      else if (t.dataset.cap) sl.cap = t.dataset.cap;
      else if (t.dataset.k) sl[t.dataset.k] = t.dataset.v;
      else if (t.dataset.again != null) { Object.assign(sl, { mid: '', cap: '', done: null }); }
      else if (t.dataset.submit != null) {
        const name = $('#sl-name', el).value.trim();
        const phone = fmtPhone($('#sl-phone', el).value);
        if (!name || nospace(phone).length !== 8) return toast('請輸入姓名同 8 位電話');
        const faults = [];
        if (sl.screen === 'cracked') faults.push('screen');
        if (sl.faceid === 'bad') faults.push('faceid');
        const batt = sl.batt === '85' ? 90 : sl.batt === '80' ? 82 : 76;
        const hi = PM.buyQuote(sl.mid, sl.cap, sl.look, batt, faults).total;
        const id = PM.nextNo('quote');
        S().leads.unshift({ id, date: TODAY + ' ' + UI.now().slice(11), name, phone, model: sl.mid, cap: sl.cap, grade: sl.look, quote: hi, status: '新報價', visit: $('#sl-day', el).value + ' ' + $('#sl-time', el).value });
        commit();
        sl.done = { id, name, phone, lo: PM.r10(hi * 0.93), hi };
        window.scrollTo(0, 0);
      }
      draw();
    });
    draw();
  }

  // ---------------------------------------------------------------- repair booking
  function repair(el) {
    const prices = S().repairPrices;
    const series = [...new Set(prices.map(p => p[0]))];
    const st = { s: series[0], item: '', done: null };
    const days = [0, 1, 2].map(n => PM.day(-n));
    const draw = () => {
      const items = prices.filter(p => p[0] === st.s);
      if (!items.some(p => p[1] === st.item)) st.item = items[0][1];
      const price = (items.find(p => p[1] === st.item) || [0, 0, 0])[2];
      if (st.done) {
        el.innerHTML = `<div class="flow"><div class="crumb"><a href="#/">首頁</a> / 維修</div><div class="ok-box">${ic('check')}<h2>預約成功 · ${st.done.id}</h2><p>${esc(st.done.name)}，${esc(st.done.date)} ${esc(st.done.slot)} 見！<br>${esc(st.done.device)} · ${esc(st.done.issue)} · ${hkd(st.done.price)}</p><p style="color:var(--muted)">我哋會 WhatsApp 提你。到店後師傅會先檢查再確認價錢。</p><a class="btn" href="#/">返回首頁</a></div></div>`;
        return;
      }
      el.innerHTML = `<div class="flow"><div class="crumb"><a href="#/">首頁</a> / 維修</div><h1>維修預約</h1><p class="lead">價錢一目了然。大部分換熒幕、換電池即日完成。</p>
        <div class="stepbox"><h3><span class="n">1</span>你部機</h3><div class="chips">${series.map(x => `<button type="button" class="ch ${x === st.s ? 'on' : ''}" data-s="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>
        <div class="stepbox"><h3><span class="n">2</span>維修項目</h3><div class="chips">${items.map(p => `<button type="button" class="ch ${p[1] === st.item ? 'on' : ''}" data-item="${esc(p[1])}">${esc(p[1])} · ${hkd(p[2])}</button>`).join('')}</div></div>
        <div class="stepbox"><h3><span class="n">3</span>時間同聯絡</h3><div class="form"><input id="rp-name" placeholder="姓名"><input id="rp-phone" placeholder="WhatsApp 電話" inputmode="tel"><select id="rp-day">${days.map((d, i) => `<option value="${d}">${['今日', '明日', '後日'][i]}（${d.slice(5)}）</option>`).join('')}</select><select id="rp-slot"><option>12:00</option><option>14:00</option><option>16:00</option><option>18:00</option><option>20:00</option></select></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px;flex-wrap:wrap"><div style="font-size:15px">${esc(st.s)} · ${esc(st.item)}：<b style="font-size:22px">${hkd(price)}</b></div><button class="btn acc" data-book>確認預約</button></div></div>
        <div style="margin-top:34px"><h3>維修價目表</h3><table class="tbl"><thead><tr><th>系列</th><th>項目</th><th class="r">價錢</th></tr></thead><tbody>${prices.map(p => `<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td class="r">${hkd(p[2])}</td></tr>`).join('')}</tbody></table></div></div>`;
    };
    el.addEventListener('click', e => {
      const t = e.target.closest('[data-s],[data-item],[data-book]');
      if (!t) return;
      if (t.dataset.s) st.s = t.dataset.s;
      else if (t.dataset.item) st.item = t.dataset.item;
      else if (t.dataset.book != null) {
        const name = $('#rp-name', el).value.trim();
        const phone = fmtPhone($('#rp-phone', el).value);
        if (!name || nospace(phone).length !== 8) return toast('請輸入姓名同 8 位電話');
        const price = (prices.find(p => p[0] === st.s && p[1] === st.item) || [0, 0, 0])[2];
        const b = { id: PM.nextNo('book'), date: $('#rp-day', el).value, slot: $('#rp-slot', el).value, name, phone, device: st.s, issue: st.item, price, status: '已預約' };
        S().bookings.unshift(b);
        commit();
        st.done = b;
        window.scrollTo(0, 0);
      }
      draw();
    });
    draw();
  }

  // ---------------------------------------------------------------- CMS page
  function page(el, slug) {
    const pg = S().cms.pages.find(p => p.slug === slug);
    if (!pg || pg.status !== '已發佈') { el.innerHTML = `<div class="page"><h1>${slug === 'about' ? 'WhatsApp 查詢' : '搵唔到頁面'}</h1><p>${slug === 'about' ? '示範網站：實際會開啟 WhatsApp 對話。' : '呢個頁面未發佈。'}</p><a class="btn" href="#/">返回首頁</a></div>`; return; }
    el.innerHTML = `<div class="page"><div class="crumb"><a href="#/">首頁</a> / ${esc(pg.title)}</div><h1>${esc(pg.title)}</h1><div class="upd">最後更新 ${esc(pg.updated)}</div>${pg.body.split(/\n+/).map(t => `<p>${esc(t)}</p>`).join('')}</div>`;
  }

  // Re-render when another tab (the backend) changes the data, unless a dialog is open.
  store.on(() => { if (!muted && !document.querySelector('.pm-overlay')) route(); });
  route();
})();

</script>
</body>
</html>
