<style>
/* Shared pieces for all three mockups: modal, toast, printouts, device art. */
:root {
  --font: -apple-system, "Segoe UI", "Microsoft JhengHei", "微軟正黑體", "PingFang HK", "Noto Sans TC", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }

/* Modal */
.pm-overlay { position: fixed; inset: 0; background: rgba(15, 18, 25, .45); display: flex; align-items: flex-start; justify-content: center; z-index: 1000; padding: 48px 16px; overflow: auto; animation: pm-fade .12s ease-out; }
.pm-modal { background: #fff; color: #18181b; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.25); width: 100%; max-width: 560px; font-family: var(--font); font-size: 14px; }
.pm-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #ececf0; font-weight: 600; font-size: 16px; }
.pm-modal-head button { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: #71717a; }
.pm-modal-body { padding: 20px; }
.pm-modal-foot { padding: 14px 20px; border-top: 1px solid #ececf0; display: flex; gap: 8px; justify-content: flex-end; }
@keyframes pm-fade { from { opacity: 0; } to { opacity: 1; } }
.pm-btn { font: 14px var(--font); padding: 8px 14px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; color: #18181b; cursor: pointer; }
.pm-btn:hover { background: #f4f4f5; }
.pm-btn.primary { background: #18181b; border-color: #18181b; color: #fff; }
.pm-btn.primary:hover { background: #27272a; }

/* Toast */
.pm-toasts { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 2000; pointer-events: none; }
.pm-toast { background: #18181b; color: #fafafa; font: 14px var(--font); padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: pm-up .18s ease-out; }
@keyframes pm-up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Printouts: 80 mm thermal paper and a 50 x 30 mm label */
.paper-stage { background: #e9e9ee; border-radius: 10px; padding: 24px; display: flex; justify-content: center; }
.receipt { width: 302px; background: #fff; color: #111; font: 12px/1.45 var(--mono); padding: 16px 14px 22px; box-shadow: 0 2px 10px rgba(0,0,0,.12); position: relative; }
.receipt::after { content: ''; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 33%, #fff 33%, #fff 66%, transparent 66%) 0 0 / 12px 8px, linear-gradient(45deg, transparent 33%, #fff 33%, #fff 66%, transparent 66%) 0 0 / 12px 8px; }
.receipt .c { text-align: center; }
.receipt .big { font-size: 16px; font-weight: 700; font-family: var(--font); }
.receipt .rule { border-top: 1px dashed #777; margin: 8px 0; }
.receipt .row { display: flex; justify-content: space-between; gap: 8px; }
.receipt .muted { color: #555; }
.receipt .tot { font-size: 15px; font-weight: 700; }
.receipt .qr { width: 96px; height: 96px; margin: 8px auto 0; }
.receipt .sig { height: 54px; border-bottom: 1px solid #333; margin-top: 6px; display: flex; align-items: flex-end; }
.receipt .sig img { max-height: 52px; }
.receipt .small { font-size: 10.5px; line-height: 1.4; }
.label { width: 302px; height: 181px; background: #fff; color: #111; border-radius: 6px; padding: 12px 14px; font: 12px var(--font); box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; flex-direction: column; justify-content: space-between; }
.label .l1 { font-weight: 700; font-size: 15px; }
.label .l2 { display: flex; justify-content: space-between; font-size: 12px; }
.label .bc { height: 44px; }
.label .bc svg { width: 100%; height: 100%; }
.label .code { font: 12px var(--mono); text-align: center; letter-spacing: .08em; }

/* Device art */
.dev { display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 35%, #fbfbfd, #eceef2); border-radius: 12px; overflow: hidden; }
.dev svg { height: 86%; width: auto; max-width: 86%; filter: drop-shadow(0 8px 14px rgba(0,0,0,.14)); }

</style>
<style>
/* Proposal B — modern admin: sidebar, scan-first top bar, cards and boards. */
:root {
  --bg: #f5f6f8; --card: #fff; --line: #e5e7eb; --line2: #eef0f3;
  --ink: #0f172a; --ink2: #334155; --muted: #64748b; --faint: #94a3b8;
  --pri: #4f46e5; --pri-d: #4338ca; --pri-50: #eef2ff; --pri-100: #e0e7ff;
  --green: #16a34a; --green-50: #f0fdf4; --amber: #b45309; --amber-50: #fffbeb; --red: #dc2626; --red-50: #fef2f2;
  --sky: #0369a1; --sky-50: #f0f9ff; --violet: #6d28d9; --violet-50: #f5f3ff; --orange: #c2410c; --orange-50: #fff7ed; --slate-50: #f1f5f9;
  --r: 12px;
}
body { margin: 0; font: 14px/1.5 var(--font); color: var(--ink); background: var(--bg); }
a { color: var(--pri); text-decoration: none; }
button { font: inherit; }
input, select, textarea { font: inherit; color: inherit; }
.ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Shell */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { background: #0f1115; color: #cbd5e1; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #ff6a2b, #ff3d6e); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px; }
.brand b { color: #fff; font-size: 15px; display: block; line-height: 1.2; }
.brand small { color: #8b93a3; font-size: 12px; }
.nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; overflow: auto; flex: 1; }
.nav .sec { font-size: 11px; letter-spacing: .06em; color: #6b7280; padding: 14px 10px 6px; text-transform: uppercase; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: #cbd5e1; cursor: pointer; }
.nav a:hover { background: #1b1e25; color: #fff; }
.nav a.on { background: #23263a; color: #fff; box-shadow: inset 2px 0 0 #818cf8; }
.nav a .cnt { margin-left: auto; background: #2b2f3a; color: #e2e8f0; font-size: 11px; padding: 0 7px; border-radius: 999px; line-height: 18px; }
.nav a .cnt.hot { background: #dc2626; color: #fff; }
.nav a kbd { margin-left: auto; font: 11px var(--font); color: #6b7280; border: 1px solid #2f3440; border-radius: 4px; padding: 0 5px; }
.side-foot { padding: 14px 18px; border-top: 1px solid #1d2028; font-size: 12px; color: #8b93a3; line-height: 1.7; }
.side-foot a { color: #a5b4fc; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 12px 28px; background: rgba(245,246,248,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.scan { flex: 1; max-width: 620px; display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; height: 40px; }
.scan:focus-within { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-100); }
.scan input { border: 0; outline: none; flex: 1; background: none; }
.scan kbd, .kbd { font: 11px var(--font); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: #fff; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--ink2); font-size: 13px; }
.seg { display: inline-flex; background: #e9ebef; border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--ink2); white-space: nowrap; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #c7d2fe; color: #3730a3; display: grid; place-items: center; font-weight: 700; }
#view { padding: 24px 28px 48px; }

/* Page header */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.ph h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.ph p { margin: 2px 0 0; color: var(--muted); }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: #f8fafc; }
.btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn.pri:hover { background: var(--pri-d); }
.btn.dark { background: #111827; border-color: #111827; color: #fff; }
.btn.green { background: var(--green); border-color: var(--green); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: #eef0f3; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.lg { height: 46px; padding: 0 20px; font-size: 15px; border-radius: 11px; }
.btn.block { width: 100%; justify-content: center; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { color: var(--pri); cursor: pointer; background: none; border: 0; padding: 0; }

/* Cards and layout */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 1px 2px rgba(15,23,42,.04); }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line2); }
.card > .hd h3 { margin: 0; font-size: 15px; }
.card > .hd .sub { color: var(--muted); font-size: 13px; }
.card > .bd { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g-side { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
.g-side2 { grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
.row { display: flex; align-items: center; gap: 10px; }
.row.sb { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.right { text-align: right; }
.mono { font-family: var(--mono); font-size: 13px; }
.hr { height: 1px; background: var(--line2); margin: 12px 0; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--slate-50); color: #475569; }
.chip.green { background: var(--green-50); color: var(--green); }
.chip.amber { background: var(--amber-50); color: var(--amber); }
.chip.red { background: var(--red-50); color: var(--red); }
.chip.sky { background: var(--sky-50); color: var(--sky); }
.chip.violet { background: var(--violet-50); color: var(--violet); }
.chip.orange { background: var(--orange-50); color: var(--orange); }
.chip.slate { background: var(--slate-50); color: #475569; }
.chip.pri { background: var(--pri-50); color: var(--pri); }
.chip.out { background: #fff; border: 1px solid var(--line); color: var(--ink2); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; }

/* KPI */
.kpi { padding: 16px 18px; }
.kpi .lb { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
.kpi .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
.kpi .s b { color: var(--ink); font-weight: 600; }

/* Bars */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 92px 1fr 96px; align-items: center; gap: 10px; font-size: 13px; }
.bar .tr { height: 10px; background: #eef0f3; border-radius: 999px; overflow: hidden; }
.bar .fl { height: 100%; background: var(--pri); border-radius: 999px; }
.bar .fl.green { background: var(--green); } .bar .fl.amber { background: #f59e0b; } .bar .fl.red { background: #ef4444; } .bar .fl.sky { background: #0ea5e9; } .bar .fl.violet { background: #8b5cf6; }

/* Queue list */
.queue a { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--line2); color: var(--ink); }
.queue a:first-child { border-top: 0; }
.queue a:hover { background: #fafbfc; }
.queue .n { font-weight: 700; font-size: 18px; min-width: 30px; }
.queue .t { flex: 1; }
.queue .t small { display: block; color: var(--muted); }

/* Table */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fafbfc; position: sticky; top: 0; white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: #fafbff; }
.tbl .thumb { width: 40px; height: 40px; border-radius: 8px; }
.tbl .t1 { font-weight: 600; }
.tbl .t2 { color: var(--muted); font-size: 12.5px; }
.tbl input { width: 100px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; text-align: right; }
.tbl-wrap { overflow: auto; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 13px; font-weight: 600; color: var(--ink2); }
.field .hint { font-size: 12px; color: var(--muted); }
.inp, .sel, .ta { height: 40px; border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; background: #fff; outline: none; width: 100%; }
.ta { height: auto; min-height: 90px; padding: 10px 12px; resize: vertical; line-height: 1.6; }
.inp:focus, .sel:focus, .ta:focus { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-100); }
.inp.big { height: 54px; font-size: 18px; border-radius: 12px; padding: 0 16px; }
.inp.num { text-align: right; }
.tog { position: relative; width: 38px; height: 22px; border-radius: 999px; background: #cbd5e1; border: 0; cursor: pointer; flex: none; }
.tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.tog.on { background: var(--green); }
.tog.on::after { left: 19px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tabs button.on { color: var(--ink); border-color: var(--pri); font-weight: 600; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters .chip { cursor: pointer; height: 30px; padding: 0 12px; }
.filters .chip.sel { background: #111827; color: #fff; }

/* Wizard */
.steps { display: flex; gap: 0; margin-bottom: 20px; }
.steps .st { flex: 1; display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 500; }
.steps .st .b { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #cbd5e1; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: #fff; flex: none; }
.steps .st::after { content: ''; flex: 1; height: 2px; background: #e2e8f0; margin: 0 10px; }
.steps .st:last-child::after { display: none; }
.steps .st.on { color: var(--ink); }
.steps .st.on .b { border-color: var(--pri); color: var(--pri); }
.steps .st.done .b { background: var(--pri); border-color: var(--pri); color: #fff; }
.devcard { display: grid; grid-template-columns: 150px 1fr; gap: 20px; align-items: center; }
.devcard .dev { height: 190px; }
.dl { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; font-weight: 500; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ck { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font-weight: 500; }
.ck .m { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--green-50); color: var(--green); }
.ck.bad { border-color: #fecaca; background: var(--red-50); }
.ck.bad .m { background: var(--red); color: #fff; }
.ck.fixed .m { background: var(--sky-50); color: var(--sky); }
.ck.static { cursor: default; }
.grades { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.gr { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: #fff; }
.gr b { display: block; font-size: 16px; }
.gr span { font-size: 12px; color: var(--muted); line-height: 1.4; display: block; margin-top: 2px; }
.gr.on { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-100); background: var(--pri-50); }
.quote { font-size: 13.5px; }
.quote .ln { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.quote .ln.neg span:last-child { color: var(--red); }
.quote .tot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; font-weight: 700; }
.quote .tot b { font-size: 26px; letter-spacing: -.02em; }
.offer { display: flex; align-items: center; gap: 8px; }
.offer .inp { font-size: 22px; font-weight: 700; height: 52px; text-align: center; }
.sig { border: 1px dashed #cbd5e1; border-radius: 10px; background: #fcfcfd; width: 100%; height: 140px; touch-action: none; cursor: crosshair; }
.success { text-align: center; padding: 28px 10px 8px; }
.success .ok { width: 60px; height: 60px; border-radius: 50%; background: var(--green-50); color: var(--green); display: grid; place-items: center; margin: 0 auto 12px; }
.success .ok .ic { width: 30px; height: 30px; stroke-width: 2.4; }
.photo-slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.photo-slots.three { grid-template-columns: repeat(3, 1fr); }
.slot { aspect-ratio: 1; border: 1.5px dashed #cbd5e1; border-radius: 12px; display: grid; place-items: center; color: var(--faint); cursor: pointer; background: #fcfcfd; position: relative; overflow: hidden; }
.slot .dev { position: absolute; inset: 0; border-radius: 0; }
.slot.full { border-style: solid; border-color: var(--line); }
.slot .cover { position: absolute; left: 6px; top: 6px; font-size: 11px; background: #111827; color: #fff; border-radius: 6px; padding: 1px 6px; z-index: 1; }

/* Board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
.col { background: #eceef2; border-radius: 14px; padding: 10px; min-height: 300px; }
.col.drop { outline: 2px dashed var(--pri); outline-offset: -4px; background: #e8eafc; }
.col > .hd { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; font-weight: 600; }
.col > .hd .c { color: var(--muted); font-weight: 500; }
.tk { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(15,23,42,.05); cursor: grab; }
.tk.late { border-color: #fecaca; box-shadow: inset 3px 0 0 var(--red); }
.tk .tt { display: flex; gap: 10px; }
.tk .tt .dev { width: 46px; height: 46px; border-radius: 8px; flex: none; }
.tk .nm { font-weight: 600; line-height: 1.35; }
.tk .cd { font-size: 12px; color: var(--muted); }
.tk .ch { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.tk .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--muted); gap: 6px; }

/* Listing studio */
.ulist { max-height: calc(100vh - 210px); overflow: auto; }
.ui { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line2); cursor: pointer; align-items: center; }
.ui:hover { background: #fafbfc; }
.ui.on { background: var(--pri-50); }
.ui .dev { width: 44px; height: 44px; border-radius: 8px; flex: none; }
.ui .nm { font-weight: 600; font-size: 13.5px; line-height: 1.35; }
.ui .cd { font-size: 12px; color: var(--muted); }
.comps { font-size: 13px; }
.comps .r { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line2); }

  function watch(m, hex, view) {
    const band = shade(hex, -0.05);
    const face = view === 'front'
      ? `<rect x="33" y="55" width="54" height="90" rx="14" fill="#000"/><text x="60" y="96" text-anchor="middle" font-size="17" font-family="Arial" fill="#fff">10:09</text><text x="60" y="114" text-anchor="middle" font-size="8" font-family="Arial" fill="#f97316">MON 2</text>`
      : `<circle cx="60" cy="100" r="22" fill="#2a2a2c" stroke="#555"/><circle cx="60" cy="100" r="8" fill="#111"/>`;
    return `<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg"><rect x="36" y="0" width="48" height="58" rx="8" fill="${band}"/><rect x="36" y="142" width="48" height="58" rx="8" fill="${band}"/><rect x="24" y="44" width="72" height="112" rx="22" fill="${view === 'front' ? '#1c1c1e' : shade(hex, -0.15)}" stroke="${hex}" stroke-width="5"/>${face}<rect x="97" y="80" width="6" height="18" rx="3" fill="${hex}"/></svg>`;

  // view: back | front | tilt | detail
  function deviceSVG(modelId, hex, view) {
    const m = typeof modelId === 'string' ? PM.modelOf(modelId) : modelId;
    const v = view === 'tilt' || view === 'detail' ? 'back' : view || 'back';
    const fn = m.family === 'iPad' ? tablet : m.family === 'Mac' ? laptop : m.family === 'Watch' ? watch : phone;
    let svg = fn(m, hex || m.colors[0][1], v);
    if (view === 'tilt') svg = svg.replace(/<svg ([^>]*)>/, '<svg $1><g transform="rotate(-14 60 120) translate(0 4)">').replace(/<\/svg>$/, '</g></svg>');
    if (view === 'detail') svg = svg.replace(/viewBox="0 0 (\d+) (\d+)"/, (s, w, h) => `viewBox="0 0 ${Math.round(w * 0.62)} ${Math.round(h * 0.38)}"`);
    return svg;
  }
  const PHOTO_VIEWS = ['back', 'front', 'tilt', 'detail', 'back', 'front'];

  // ---------- QR and barcode art (look-alikes, not scannable) ----------
  function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function qrSVG(text) {
    const n = 25; let h = hash(text) || 1; let cells = '';
    const inFinder = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (inFinder(x, y)) continue;
      h = (Math.imul(h, 1103515245) + 12345) >>> 0;
      if ((h >>> 16) % 2 === 0) cells += `M${x} ${y}h1v1h-1z`;
    }
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#000"/>`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${cells}" fill="#000"/>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
  }
  function barcodeSVG(text) {
    let bits = '11010010000';
    for (const c of String(text)) bits += (hash(c + text.length) >>> 3).toString(2).padStart(11, '0').slice(-11) + '0';
    bits += '1100011101011';
    let x = 0, d = '';
    for (const b of bits) { if (b === '1') d += `M${x} 0h1v40h-1z`; x++; }
    return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
  }

  // ---------- toast ----------
  function toast(msg) {
    let box = $('.pm-toasts');
    if (!box) { box = document.createElement('div'); box.className = 'pm-toasts'; document.body.appendChild(box); }
    const t = document.createElement('div');
    t.className = 'pm-toast';
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 2800);
  }

  // ---------- modal ----------
  function modal({ title, body, foot, width, onClose }) {
    const ov = document.createElement('div');
    ov.className = 'pm-overlay';
    ov.innerHTML = `<div class="pm-modal" style="max-width:${width || 560}px" role="dialog" aria-modal="true"><div class="pm-modal-head"><span>${title || ''}</span><button type="button" data-close aria-label="關閉">×</button></div><div class="pm-modal-body">${body || ''}</div>${foot ? `<div class="pm-modal-foot">${foot}</div>` : ''}</div>`;
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); if (onClose) onClose(); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
    ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    return { el: ov.querySelector('.pm-modal'), close };
  }

  function printPreview(html, opts) {
    opts = opts || {};

      title: opts.title || '列印預覽',
      width: opts.width || 440,

      foot: `<button type="button" class="pm-btn" data-close>關閉</button><button type="button" class="pm-btn primary" data-print>列印</button>`,
    });
    m.el.querySelector('[data-print]').addEventListener('click', () => { m.close(); toast(opts.sent || '已送到收據打印機（示範）'); });

  // ---------- printouts ----------
  const STORE = () => PM.store.get().cms.store;

  const row = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`;
  const plusMonths = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCMonth(t.getUTCMonth() + n); return t.toISOString().slice(0, 10); };

  function receiptSale(d) {

    const pays = (d.payments || []).map(p => row(esc(p.method), hkd(p.amount))).join('');

  }

  function slipBuyback(d) {
    const fails = (d.faults || []).length ? d.faults.map(PM.checkName).join('、') : '全部合格';
    return `<div class="receipt">${head('二手機回收單')}${row('單號', esc(d.no))}${row('日期', esc(d.date))}${row('店員', esc(d.staff))}<div class="rule"></div>${row('賣方', esc(d.name))}${row('電話', maskPhone(d.phone))}${d.idno ? row('證件', esc(d.idno)) : ''}<div class="rule"></div><div>${esc(d.title)}</div>${row(d.imei && d.imei.length === 15 ? 'IMEI' : '序號', esc(d.imei))}${row('成色 / 電池', esc(d.grade) + ' / ' + d.battery + '%')}${row('17 點檢查', esc(fails))}<div class="rule"></div>${row('付款方式', esc(d.pay))}<div class="row tot"><span>回收價</span><span>${hkd(d.price)}</span></div><div class="rule"></div><div class="small">本人確認上述裝置為本人合法擁有，並無任何借貸、按揭或盜竊來源，已關閉「尋找」功能及登出帳戶，並同意以上價錢出售予手機俠。</div><div class="small" style="margin-top:8px">賣方簽署</div><div class="sig">${d.signature ? `<img alt="簽署" src="${d.signature}">` : ''}</div><div class="c small" style="margin-top:8px">個人資料只用於交易紀錄，按《個人資料（私隱）條例》處理。</div></div>`;

  }

  function label(u) {
    const m = PM.modelOf(u.model);
    return `<div class="label"><div><div class="l1">${esc(m.name)} ${esc(u.cap)}</div><div class="l2"><span>${esc(u.color)} · ${esc(u.grade)}${u.battery ? ' · 電池 ' + u.battery + '%' : ''}</span></div></div><div class="bc">${barcodeSVG(u.code)}</div><div class="l2"><span class="code">${esc(u.code)}</span><b>${hkd(u.price)}</b></div></div>`;
  }

  // ---------- signature pad ----------
  function signaturePad(canvas) {
    const ctx = canvas.getContext('2d');
    let drawing = false, empty = true, last = null;
    const pos = e => { const r = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return [(p.clientX - r.left) * canvas.width / r.width, (p.clientY - r.top) * canvas.height / r.height]; };
    const start = e => { drawing = true; last = pos(e); e.preventDefault(); };
    const move = e => { if (!drawing) return; const p = pos(e); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; empty = false; e.preventDefault(); };
    const end = () => { drawing = false; };
    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end);
    return {
      clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); empty = true; },
      isEmpty: () => empty,
      toDataURL: () => canvas.toDataURL('image/png'),
      demo() { this.clear(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); const w = canvas.width, h = canvas.height; ctx.moveTo(w * .12, h * .62); for (let i = 0; i <= 40; i++) { const x = w * (.12 + i * .018); ctx.lineTo(x, h * (.55 + Math.sin(i * .7) * .18 - i * .002)); } ctx.stroke(); empty = false; },
    };
  }

  const LINKS = Object.assign({ hub: '../', a: '../a/', b: '../b/', shop: '../shop/' }, window.PM_LINKS || {});
  const link = (app, hash) => LINKS[app] + (hash || '');
  const shopURL = hash => link('shop', hash);

  const STATUS = {
    qc: { label: '待QC', tone: 'amber' },
    refurb: { label: '翻新中', tone: 'orange' },
    ready: { label: '可上架', tone: 'sky' },
    listed: { label: '已上架', tone: 'green' },
    reserved: { label: '已預留', tone: 'violet' },
    sold: { label: '已售', tone: 'slate' },
  };

  window.UI = { esc, $, $$, now, hkd, maskPhone, shade, lum, deviceSVG, photoSVG, qrSVG, barcodeSVG, toast, modal, printPreview, receiptSale, slipBuyback, ticketRepair, label, signaturePad, STATUS, plusMonths, link, shopURL };
})();

  // Hash routing, with an in-memory fallback for pages that can't change their hash (e.g. previews).

  function go(path) {

    const rp = s.repairs.find(x => x.no === up);

  // ---------------------------------------------------------------- 回收 buyback wizard

  let bb = BB0();

  function bbStep2() {
    return `<div class="card"><div class="hd"><h3>17 點檢查</h3><span class="sub">全部預設正常，有問題就撳一下</span></div><div class="bd stack">
      <div class="checks">${PM.CHECKS.map(c => `<button type="button" class="ck ${bb.checks[c.id] ? 'bad' : ''}" data-act="ck" data-id="${c.id}">${c.name}<span class="m">${ic(bb.checks[c.id] ? 'x' : 'check', 'width:14px;height:14px')}</span></button>`).join('')}</div>

      </div>

      <div class="row sb"><button class="btn ghost" data-act="prev">${ic('back')}上一步</button><button class="btn pri lg" data-act="next">下一步：報價 ${ic('arrow')}</button></div>
    </div></div>`;
  }

  function bbStep3(m, q) {
    const sell = PM.askPrice(m, bb.cap, bb.grade, bb.battery);
    const faults = Object.keys(bb.checks).filter(k => bb.checks[k]);
    const fixCost = faults.reduce((a, f) => a + PM.faultFix(f), 0);
    const profit = sell - bb.offer - fixCost;
    const over = bb.offer > q.total * 1.05;
    const comps = S().units.filter(u => u.model === bb.mid && (u.sold || u.status === 'listed')).slice(0, 4);
    return `<div class="stack">
      <div class="card"><div class="hd"><h3>報價</h3><span class="sub">按回收價目表自動計算（網站設定 › 回收價目表）</span></div><div class="bd">
        <div class="grid g2" style="gap:24px">
          <div class="quote">
            <div class="ln"><span>基本價（${esc(m.name)} ${esc(bb.cap)}，A 級）</span><span class="num">${hkd(q.base)}</span></div>
            <div class="ln ${q.gradeAdj < 0 ? 'neg' : ''}"><span>成色 ${esc(bb.grade)}</span><span class="num">${q.gradeAdj >= 0 ? '+' : ''}${hkd(q.gradeAdj).replace('HK$-', '-HK$')}</span></div>
            <div class="ln ${q.battAdj < 0 ? 'neg' : ''}"><span>電池 ${bb.battery}%</span><span class="num">${q.battAdj ? hkd(q.battAdj).replace('HK$-', '-HK$') : '—'}</span></div>
            ${q.faultAdj.map(f => `<div class="ln neg"><span>問題：${esc(f.name)}</span><span class="num">${hkd(f.amount).replace('HK$-', '-HK$')}</span></div>`).join('')}
            <div class="tot"><span>建議回收價</span><b class="num">${hkd(q.total)}</b></div>
          </div>
          <div class="stack">
            <div class="field"><label>實際出價</label><div class="offer"><button class="btn lg" data-act="offer" data-d="-50">−50</button><input class="inp num" id="bb-offer" value="${bb.offer}"><button class="btn lg" data-act="offer" data-d="50">+50</button></div></div>
            ${over ? (isMgr() ? `<div class="note-ok">${ic('check')}高於建議價超過 5%，經理已批核。</div>` : `<div class="warn">${ic('alert')}<span>高於建議價超過 5%，需要經理批核先可以完成。</span></div>`) : `<div class="note-ok">${ic('check')}在建議價範圍內，毋須批核。</div>`}
            <button class="btn ghost sm" data-act="offer-reset" style="align-self:flex-start">還原建議價</button>
          </div>
        </div>
      </div></div>
      <div class="card"><div class="hd"><h3>利潤預算</h3><span class="sub">只限經理</span></div><div class="bd">${isMgr() ? `
        <div class="grid g3">
          <div><div class="small muted">預計售價</div><div style="font-size:20px;font-weight:700" class="num">${hkd(sell)}</div></div>
          <div><div class="small muted">預計翻新成本</div><div style="font-size:20px;font-weight:700" class="num">${hkd(fixCost)}</div></div>
          <div><div class="small muted">預計毛利</div><div style="font-size:20px;font-weight:700;color:${profit > 0 ? 'var(--green)' : 'var(--red)'}" class="num">${hkd(profit)}（${Math.round(profit / sell * 100)}%）</div></div>
        </div>
        <div class="comps" style="margin-top:14px"><div class="small muted" style="margin-bottom:4px">近期同款</div>${comps.length ? comps.map(u => `<div class="r"><span>${u.sold ? '已售 ' + md(u.sold.date) : '在售'} · ${esc(u.cap)} · ${esc(u.grade)} · 電池 ${u.battery}%</span><span class="num">${hkd(u.sold ? u.sold.price : u.price)}</span></div>`).join('') : '<div class="muted">未有同款紀錄</div>'}</div>` : lockedNote()}
      </div></div>
      <div class="row sb"><button class="btn ghost" data-act="prev">${ic('back')}上一步</button><button class="btn pri lg" data-act="next" ${over && !isMgr() ? 'disabled' : ''}>下一步：客戶及付款 ${ic('arrow')}</button></div>
    </div>`;
  }

  function bbStep4() {
    const c = PM.customer(fmtPhone(bb.phone));
    const hist = c ? S().slips.filter(x => x.phone === c.phone).length + S().invoices.filter(x => x.phone === c.phone).length : 0;
    return `<div class="card"><div class="hd"><h3>客戶及付款</h3><span class="sub">個人資料只用於交易紀錄</span></div><div class="bd stack">
      <div class="grid g2">
        <div class="field"><label>電話</label><input class="inp" id="bb-phone" value="${esc(bb.phone)}" placeholder="例如 9123 4567"></div>
        <div class="field"><label>姓名</label><input class="inp" id="bb-name" value="${esc(bb.name || (c ? c.name : ''))}"></div>
      </div>
      ${c ? `<div class="note-ok">${ic('users')}<span>熟客：<b>${esc(c.name)}</b>，${hist} 次交易，${esc(c.since)} 起。${c.note ? esc(c.note) : ''}</span></div>` : bb.phone && nospace(bb.phone).length === 8 ? `<div class="note-ok" style="background:#f8fafc;color:#475569;border-color:#e2e8f0">${ic('plus')}新客戶，完成後自動建立客戶資料。</div>` : ''}
      <div class="grid g2">
        <div class="field"><label>證件號碼（選填）</label><input class="inp" id="bb-id" value="${esc(bb.idno)}" placeholder="只記錄頭 4 位，例如 A123***(*)"></div>
        <div class="field"><label>付款方式</label><div class="seg" style="align-self:flex-start">${['轉數快', '現金'].map(p => `<button type="button" data-act="pay" data-id="${p}" class="${bb.pay === p ? 'on' : ''}">${p}</button>`).join('')}</div>${bb.pay === '轉數快' ? `<input class="inp" id="bb-fps" value="${esc(bb.fps)}" placeholder="轉數快 ID 或電話" style="margin-top:6px">` : '<span class="hint">現金會喺日結自動扣減</span>'}</div>
      </div>
      <label class="row" style="align-items:flex-start"><input type="checkbox" id="bb-agree" ${bb.agree ? 'checked' : ''} style="margin-top:4px"><span class="small">賣方確認此裝置為本人合法擁有，並無借貸、按揭或盜竊來源，已關閉「尋找」功能及登出帳戶，並同意以 <b>${hkd(bb.offer)}</b> 出售予手機俠。</span></label>
      <div class="field"><div class="row sb"><label>賣方簽署</label><span class="row" style="gap:6px"><button class="btn sm ghost" data-act="sig-demo">示範簽名</button><button class="btn sm ghost" data-act="sig-clear">清除</button></span></div><canvas class="sig" id="bb-sig" width="900" height="200"></canvas></div>
      <div class="row sb"><button class="btn ghost" data-act="prev">${ic('back')}上一步</button><button class="btn green lg" data-act="confirm">${ic('check')}確認回收 · ${bb.pay === '現金' ? '支付現金' : '轉數快支付'} ${hkd(bb.offer)}</button></div>
    </div></div>`;
  }

  function bbStep5() {
    const r = bb.result;
    const u = PM.unit(r.code);
    return `<div class="card"><div class="bd"><div class="success"><div class="ok">${ic('check')}</div><h2 style="margin:0 0 6px">回收完成</h2><p class="muted" style="margin:0 0 18px">回收單 <b class="mono">${r.slipNo}</b> · 貨品編號 <b class="mono">${r.code}</b> · 已${u.status === 'refurb' ? '送去翻新（' + u.faults.map(PM.checkName).join('、') + '）' : '放入「待 QC」'}</p>
      <div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn" data-act="print-slip">${ic('printer')}列印回收單</button><button class="btn" data-act="print-label">${ic('tag')}列印標籤</button><button class="btn" data-go="/unit/${r.code}">${ic('eye')}查看裝置檔案</button><button class="btn pri" data-act="again">${ic('recycle')}再回收一部</button></div>
      <p class="small muted" style="margin-top:18px">已自動完成：建立裝置檔案、記錄付款、更新客戶紀錄${u.status === 'refurb' ? '、開翻新單' : ''}。</p></div></div></div>
      <div class="card"><div class="hd"><h3>下一步</h3></div><div class="bd stack small">
        <div class="row">${ic('sparkle')}<span>${u.status === 'refurb' ? '師傅喺「翻新」板處理維修，完成後成本自動計入。' : '師傅喺「翻新」板做詳細 QC 及清除資料。'}</span></div>
        <div class="row">${ic('camera')}<span>合格後喺「上架」影相，一按就上網店。</span></div>
        <div class="row">${ic('globe')}<span>網店即時顯示，客人可以預留或購買。</span></div>
      </div></div>`;
  }

  // Delegated listeners, attached once per screen.
  function bindBuyback(el) {
    el.addEventListener('input', e => {
      const k = e.target.dataset.bb;
      if (k === 'battery') { bb.battery = Math.max(0, Math.min(100, +e.target.value || 0)); $$('[data-bb=battery]', el).forEach(i => { if (i !== e.target) i.value = bb.battery; }); bb.offer = null; }
      if (e.target.id === 'bb-offer') bb.offer = +e.target.value || 0;
      if (e.target.id === 'bb-phone') bb.phone = e.target.value;
      if (e.target.id === 'bb-name') bb.name = e.target.value;
      if (e.target.id === 'bb-id') bb.idno = e.target.value;
      if (e.target.id === 'bb-fps') bb.fps = e.target.value;
    });
    el.addEventListener('change', e => {
      const k = e.target.dataset.bb;
      if (k === 'mid') { bb.mid = e.target.value; const m = modelOf(bb.mid); bb.cap = Object.keys(m.base)[0]; bb.color = m.colors[0][0]; bb.offer = null; renderBuyback(el); }
      else if (k === 'cap' || k === 'color' || k === 'region') { bb[k] = e.target.value; bb.offer = null; renderBuyback(el); }
      else if (k === 'battery') renderBuyback(el);
      else if (e.target.id === 'bb-offer') renderBuyback(el);
      else if (e.target.id === 'bb-phone') { const c = PM.customer(fmtPhone(bb.phone)); if (c && !bb.name) bb.name = c.name; renderBuyback(el); }
      else if (e.target.id === 'bb-agree') bb.agree = e.target.checked;
    });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;
      const a = b.dataset.act;
      if (a === 'restart' || a === 'again') { bb = BB0(); renderBuyback(el); return; }
      if (a === 'sim-scan') { bb.imei = ''; doScan(el, true); return; }
      if (a === 'use-lead') { const l = S().leads.find(x => x.id === b.dataset.id); Object.assign(bb, { lead: l.id, mid: l.model, cap: l.cap, grade: l.grade, phone: l.phone, name: l.name, color: modelOf(l.model).colors[0][0] }); toast('已帶入網上報價：' + l.name); renderBuyback(el); return; }
      if (a === 'tog-findmy') { bb.findmy = !bb.findmy; renderBuyback(el); return; }
      if (a === 'tog-signout') { bb.signout = !bb.signout; renderBuyback(el); return; }
      if (a === 'ck') { const id = b.dataset.id; bb.checks[id] = !bb.checks[id]; bb.offer = null; renderBuyback(el); return; }
      if (a === 'grade') { bb.grade = b.dataset.id; bb.offer = null; renderBuyback(el); return; }
      if (a === 'bb-photo') { bb.photos = Math.min(3, bb.photos + 1); renderBuyback(el); return; }
      if (a === 'offer') { bb.offer = Math.max(0, (+bb.offer || 0) + +b.dataset.d); renderBuyback(el); return; }
      if (a === 'offer-reset') { bb.offer = null; renderBuyback(el); return; }
      if (a === 'pay') { bb.pay = b.dataset.id; renderBuyback(el); return; }
      if (a === 'sig-clear') { sigPad.clear(); bb.sigData = null; return; }
      if (a === 'sig-demo') { sigPad.demo(); bb.sigData = sigPad.toDataURL(); return; }
      if (a === 'prev') { if (bb.step === 4 && sigPad && !sigPad.isEmpty()) bb.sigData = sigPad.toDataURL(); bb.step--; renderBuyback(el); return; }
      if (a === 'next') { bb.step++; renderBuyback(el); return; }
      if (a === 'confirm') { if (sigPad && !sigPad.isEmpty()) bb.sigData = sigPad.toDataURL(); confirmBuyback(el); return; }
      if (a === 'print-slip') { printBBSlip(); return; }
      if (a === 'print-label') { UI.printPreview(UI.label(PM.unit(bb.result.code)), { title: '列印預覽 · 標籤 50×30mm', sent: '已送到標籤打印機（示範）' }); }
    });
  }

  function doScan(el, demo) {
    bb.scanning = true;
    renderBuyback(el);
    setTimeout(() => {
      if (demo && !bb.lead) { bb.mid = 'ip15p'; bb.cap = '256GB'; bb.color = '藍色鈦金屬'; bb.region = 'US'; }
      const m = modelOf(bb.mid);
      if (demo || !bb.imei) bb.imei = m.cellular === false ? PM.makeSerial() : PM.makeImei();
      const prev = S().units.find(u => u.imei === bb.imei || u.serial === bb.imei);
      bb.dup = prev ? `${prev.bought} 回收（${prev.code}，${UI.STATUS[prev.status].label}）` : null;
      bb.scanning = false; bb.scanned = true; bb.offer = null;
      renderBuyback(el);
    }, 650);
  }

  function confirmBuyback(el) {
    const phone = fmtPhone(bb.phone);
    if (nospace(phone).length !== 8) return toast('請輸入 8 位電話號碼');
    if (!bb.name) { const c = PM.customer(phone); if (c) bb.name = c.name; }
    if (!bb.name) return toast('請輸入姓名');
    if (!bb.agree) return toast('請賣方確認聲明');
    if (!bb.sigData) return toast('請賣方簽署');
    const s = S();
    const m = modelOf(bb.mid);
    const faults = Object.keys(bb.checks).filter(k => bb.checks[k]);
    const code = PM.nextNo('unit');
    const slipNo = PM.nextNo('slip');
    const price = PM.askPrice(m, bb.cap, bb.grade, bb.battery);
    const u = {
      code, model: bb.mid, cap: bb.cap, color: bb.color, hex: (m.colors.find(c => c[0] === bb.color) || m.colors[0])[1], grade: bb.grade, battery: bb.battery, region: bb.region, os: m.os,
      imei: m.cellular === false ? '' : bb.imei, serial: m.cellular === false ? bb.imei : '', cost: bb.offer, refurb: 0, price, floor: PM.r10(price * 0.93),
      status: faults.length ? 'refurb' : 'qc', photos: bb.photos, bought: TODAY, slip: slipNo, seller: phone, staff: 'Alan', faults, tech: faults.length ? 'Dicky' : '', place: faults.length ? '店內' : '', fixFrom: faults.length ? TODAY : '',
      reserved: null, sold: null, checks: {}, events: [],
    };
    PM.CHECKS.forEach(c => { u.checks[c.id] = faults.includes(c.id) ? 'fault' : 'ok'; });
    u.events.push({ d: TODAY, type: '回收', note: `回收單 ${slipNo}，${bb.pay} ${hkd(bb.offer)}`, by: 'Alan' });
    u.events.push({ d: TODAY, type: '櫃面檢查', note: faults.length ? '發現問題：' + faults.map(PM.checkName).join('、') : '17 點檢查全部正常', by: 'Alan' });
    if (faults.length) u.events.push({ d: TODAY, type: '送修', note: `${faults.map(PM.checkName).join('、')} → Dicky`, by: 'Alan' });
    s.units.push(u);
    PM.upsertCustomer(phone, bb.name);
    s.slips.unshift({ no: slipNo, date: TODAY, phone, name: bb.name, idno: bb.idno, code, price: bb.offer, pay: bb.pay, staff: 'Alan' });
    if (faults.length) s.jobs.unshift({ no: PM.nextNo('fix'), code, date: TODAY, faults, tech: 'Dicky', place: '店內', eta: PM.day(-2), cost: 0, done: '', by: '' });
    if (bb.lead) { const l = s.leads.find(x => x.id === bb.lead); if (l) l.status = '已回收'; }
    commit();
    bb.result = { code, slipNo, sig: bb.sigData };
    bb.step = 5;
    renderBuyback(el);
    renderNav('/buyback');
    toast('回收完成：' + code);
  }

  function printBBSlip() {
    const r = bb.result;
    const u = PM.unit(r.code);
    const slip = S().slips.find(x => x.no === r.slipNo);
    UI.printPreview(UI.slipBuyback({ no: slip.no, date: UI.now(), staff: slip.staff, name: slip.name, phone: slip.phone, idno: slip.idno, title: unitTitle(u), imei: u.imei || u.serial, grade: u.grade, battery: u.battery, faults: u.faults, pay: slip.pay, price: slip.price, signature: r.sig }), { title: '列印預覽 · 回收單 80mm' });
  }

  // ---------------------------------------------------------------- 庫存 stock
  let stF = 'all', stFam = 'all', stSort = 'new', stQ = '';
  ROUTES['/stock'] = (el, _, q) => {
    if (q.get('status')) stF = q.get('status');
    if (q.get('sort')) stSort = q.get('sort');
    const all = S().units;
    const counts = { all: all.filter(u => u.status !== 'sold').length };
    Object.keys(UI.STATUS).forEach(k => { counts[k] = all.filter(u => u.status === k).length; });
    let rows = all.filter(u => (stF === 'all' ? u.status !== 'sold' : u.status === stF));
    if (stFam !== 'all') rows = rows.filter(u => modelOf(u.model).family === stFam);
    if (stQ) { const qq = stQ.toLowerCase(); rows = rows.filter(u => (unitTitle(u) + u.code + u.imei + u.serial).toLowerCase().includes(qq)); }
    rows.sort(stSort === 'age' ? (a, b) => PM.unitAge(b) - PM.unitAge(a) : stSort === 'price' ? (a, b) => b.price - a.price : (a, b) => b.bought.localeCompare(a.bought) || b.code.localeCompare(a.code));
    const mgr = isMgr();
    el.innerHTML = `
      <div class="ph"><div><h1>庫存</h1><p>每部機一個檔案。撳任何一行睇完整紀錄。</p></div><div class="acts"><button class="btn" data-act="export">${ic('copy')}匯出 Excel</button><button class="btn pri" data-go="/buyback">${ic('plus')}回收新機</button></div></div>
      <div class="filters">${[['all', '在庫']].concat(Object.keys(UI.STATUS).map(k => [k, UI.STATUS[k].label])).map(([k, l]) => `<span class="chip ${stF === k ? 'sel' : 'out'}" data-act="f" data-id="${k}">${l} ${counts[k]}</span>`).join('')}
        <span style="flex:1"></span>
        <select class="sel" style="width:150px;height:34px" data-act-change="fam"><option value="all">全部系列</option>${PM.FAMILIES.map(f => `<option value="${f.family}"${stFam === f.family ? ' selected' : ''}>${f.name}</option>`).join('')}</select>
        <select class="sel" style="width:130px;height:34px" data-act-change="sort"><option value="new"${stSort === 'new' ? ' selected' : ''}>最新回收</option><option value="age"${stSort === 'age' ? ' selected' : ''}>庫齡最長</option><option value="price"${stSort === 'price' ? ' selected' : ''}>售價最高</option></select>
        <input class="inp" style="width:220px;height:34px" placeholder="搜尋型號、編號、IMEI" value="${esc(stQ)}" data-act-input="q"></div>
      <div class="card tbl-wrap"><table class="tbl"><thead><tr><th></th><th>裝置</th><th>成色</th><th>電池</th><th>產地</th><th class="right">售價</th>${mgr ? '<th class="right">成本</th><th class="right">預計毛利</th>' : ''}<th>庫齡</th><th>狀態</th><th>相片</th></tr></thead><tbody>
        ${rows.map(u => { const c = u.cost + u.refurb; return `<tr class="click" data-go="/unit/${u.code}"><td style="width:52px">${devArt(u, 'back', 'thumb')}</td><td><div class="t1">${esc(unitTitle(u))}</div><div class="t2 mono">${u.code} · ${esc(idOf(u))}</div></td><td>${chip(esc(u.grade), 'out')}</td><td>${battChip(u.battery)}</td><td>${PM.REGIONS[u.region]}</td><td class="right num"><b>${hkd(u.price)}</b></td>${mgr ? `<td class="right num muted">${hkd(c)}</td><td class="right num" style="color:var(--green)">${hkd(u.price - c)}</td>` : ''}<td>${ageChip(PM.unitAge(u))}</td><td>${statusChip(u.status)}</td><td class="muted">${u.photos ? u.photos + ' 張' : '—'}</td></tr>`; }).join('') || `<tr><td colspan="11"><div class="empty">冇符合條件的裝置</div></td></tr>`}
      </tbody></table></div>`;
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'f') { stF = b.dataset.id; route(); }
      if (b.dataset.act === 'export') toast('已匯出 Excel（示範）');
    });

          <div class="card"><div class="hd"><h3>時間線</h3></div><div class="bd"><div class="tl">${u.events.slice().reverse().map(ev => `<div class="ev"><div class="h"><b>${esc(ev.type)}</b><span>${md(ev.d)} · ${esc(ev.by || '')}</span></div><p>${esc(ev.note)}</p></div>`).join('')}</div></div></div>

  // ---------------------------------------------------------------- refurb actions shared by board and passport
  function passQC(u) {
    u.status = 'ready';
    PM.CHECKS.forEach(c => { if (!u.checks[c.id]) u.checks[c.id] = 'ok'; });
    u.events.push({ d: TODAY, type: 'QC', note: '詳細 QC 合格，已清除資料', by: 'Dicky' });
    commit(); route(); toast('QC 合格，已移到「上架」');
  }
  function sendToFix(u) {
    const m = UI.modal({ title: '送修 · ' + unitTitle(u), width: 620, body: `<div class="field"><label>問題（撳選）</label><div class="checks" id="sf-checks">${PM.CHECKS.map(c => `<button type="button" class="ck ${u.faults.includes(c.id) ? 'bad' : ''}" data-id="${c.id}">${c.name}<span class="m">${ic(u.faults.includes(c.id) ? 'x' : 'check', 'width:14px;height:14px')}</span></button>`).join('')}</div></div><div class="grid g2" style="margin-top:14px"><div class="field"><label>師傅</label><select class="sel" id="sf-tech">${PM.TECHS.map(t => `<option>${t}</option>`).join('')}</select></div><div class="field"><label>預計完成</label><input class="inp" id="sf-eta" value="${PM.day(-3)}"></div></div>`, foot: '<button class="pm-btn" data-close>取消</button><button class="pm-btn primary" data-ok>送修</button>' });
    $('#sf-checks', m.el).addEventListener('click', e => { const b = e.target.closest('.ck'); if (!b) return; b.classList.toggle('bad'); $('.m', b).innerHTML = ic(b.classList.contains('bad') ? 'x' : 'check', 'width:14px;height:14px'); });
    $('[data-ok]', m.el).addEventListener('click', () => {
      const faults = $$('#sf-checks .ck.bad', m.el).map(b => b.dataset.id);
      if (!faults.length) return toast('請揀至少一個問題');
      const tech = $('#sf-tech', m.el).value;
      Object.assign(u, { status: 'refurb', faults, tech, place: tech === 'Dicky' ? '店內' : '外判', fixFrom: TODAY });
      faults.forEach(f => { u.checks[f] = 'fault'; });
      u.events.push({ d: TODAY, type: '送修', note: `${faults.map(PM.checkName).join('、')} → ${tech}`, by: 'Dicky' });
      S().jobs.unshift({ no: PM.nextNo('fix'), code: u.code, date: TODAY, faults, tech, place: u.place, eta: $('#sf-eta', m.el).value, cost: 0, done: '', by: '' });
      m.close(); commit(); route(); toast('已送修：' + tech);
    });
  }
  function finishFix(u) {
    const est = u.faults.reduce((a, f) => a + PM.faultFix(f), 0);
    const m = UI.modal({ title: '翻新完成 · ' + unitTitle(u), width: 480, body: `<div class="stack"><div>維修項目：<b>${u.faults.map(PM.checkName).join('、')}</b>（${esc(u.tech)}）</div><div class="field"><label>實際成本 (HK$)</label><input class="inp num" id="ff-cost" value="${est}"><span class="hint">成本會自動加入裝置成本，毛利即時更新。</span></div><label class="row"><input type="checkbox" id="ff-batt"> 已更換電池，電池健康度更新為 100%</label></div>`, foot: '<button class="pm-btn" data-close>取消</button><button class="pm-btn primary" data-ok>完成</button>' });
    if (u.faults.includes('battery')) $('#ff-batt', m.el).checked = true;
    $('[data-ok]', m.el).addEventListener('click', () => {
      const cost = +$('#ff-cost', m.el).value || 0;
      u.refurb += cost;
      u.faults.forEach(f => { u.checks[f] = 'fixed'; });
      if ($('#ff-batt', m.el).checked) u.battery = 100;
      u.events.push({ d: TODAY, type: '翻新', note: `${u.faults.map(PM.checkName).join('、')}，成本 ${hkd(cost)}`, by: u.tech });
      const job = S().jobs.find(j => j.code === u.code && !j.done);
      if (job) { job.done = TODAY; job.cost = cost; job.by = u.tech; }
      Object.assign(u, { faults: [], tech: '', place: '', status: 'ready' });
      m.close(); commit(); route(); toast('翻新完成，成本已計入，移到「上架」');
    });
  }

  // ---------------------------------------------------------------- 翻新 refurb board
  ROUTES['/refurb'] = el => {
    const s = S();

    const done = s.jobs.filter(j => j.done);
    const avg = done.length ? (done.reduce((a, j) => a + PM.daysBetween(j.date, j.done), 0) / done.length).toFixed(1) : '—';

      if (b.dataset.act === 'done') finishFix(u);

        else if (u.status === 'refurb' && to === 'ready') finishFix(u);

  // ---------------------------------------------------------------- 收銀 checkout
  let cart = [];
  let pays = [];
  const ck = { phone: '', channel: '門市', staff: 'Bonnie', approved: false };
  function addToCart(code) {
    const u = PM.unit(code);
    if (!u) return '搵唔到此貨品';
    if (u.status === 'sold') return '此貨品已售出';
    if (u.status === 'qc' || u.status === 'refurb') return '此貨品' + UI.STATUS[u.status].label + '，未可出售';
    if (cart.some(l => l.code === code)) return '已在收銀單內';
    cart.push({ code, price: u.price });
    if (u.reserved && !ck.phone) ck.phone = u.reserved.by;
    if (u.reserved && u.reserved.channel === '網店') ck.channel = '網店';
    return '';
  }
  ROUTES['/checkout'] = el => {
    const s = S();
    const lines = cart.map(l => ({ ...l, u: PM.unit(l.code) })).filter(l => l.u && l.u.status !== 'sold');

    const list = lines.reduce((a, l) => a + l.u.price, 0);
    const total = lines.reduce((a, l) => a + l.price, 0);
    const deposit = lines.reduce((a, l) => a + (l.u.reserved ? l.u.reserved.deposit : 0), 0);
    const due = total - deposit;
    const paid = pays.reduce((a, p) => a + (+p.amount || 0), 0);
    const remain = due - paid;
    const below = lines.filter(l => l.price < l.u.floor);
    const needApprove = below.length && !isMgr() && !ck.approved;
    const c = PM.customer(fmtPhone(ck.phone));

    el.innerHTML = `
      <div class="ph"><div><h1>收銀</h1><p>掃描、收款、列印，一張單完成發票同收據。</p></div>${cart.length ? '<div class="acts"><button class="btn ghost" data-act="clear">清除</button></div>' : ''}</div>
      <div class="grid g-side">
        <div class="stack">
          <div class="card"><div class="bd stack">
            <div class="row"><input class="inp big mono" id="ck-scan" placeholder="掃描貨品編號、IMEI 或標籤條碼，按 Enter"><button class="btn lg dark" data-act="scan-demo">${ic('scan')}模擬掃描</button></div>
            <div class="hintchips">試下：${picks.map(u => `<button type="button" data-act="pick" data-code="${u.code}">${u.code}</button>`).join('')}</div>
          </div></div>
          <div class="card"><div class="hd"><h3>貨品</h3><span class="sub">${lines.length} 件</span></div><div class="bd">
            ${lines.length ? lines.map(l => `<div class="cart-line">${devArt(l.u, 'back')}<div><div style="font-weight:600">${esc(unitTitle(l.u))}</div><div class="small muted mono">${l.u.code} · ${esc(idOf(l.u))}</div><div class="row" style="gap:5px;margin-top:6px;flex-wrap:wrap">${chip(esc(l.u.grade), 'out')}${battChip(l.u.battery)}${chip(PM.REGIONS[l.u.region], 'out')}${l.u.reserved ? chip('已預留 · 訂金 ' + hkd(l.u.reserved.deposit), 'violet') : ''}${l.price < l.u.floor ? chip('低於底價 ' + hkd(l.u.floor), 'red') : l.price < l.u.price ? chip('折扣 ' + hkd(l.u.price - l.price), 'amber') : ''}</div></div><input class="inp num" data-price="${l.code}" value="${l.price}"><button class="btn sm ghost" data-act="rm" data-code="${l.code}" aria-label="移除">${ic('x')}</button></div>`).join('') : '<div class="empty">掃描貨品開始收銀</div>'}
          </div></div>
          <div class="card"><div class="bd grid g3" style="align-items:end">
            <div class="field"><label>客戶電話（選填）</label><input class="inp" id="ck-phone" value="${esc(ck.phone)}" placeholder="9123 4567"></div>
            <div class="field"><label>渠道</label><select class="sel" id="ck-ch">${PM.CHANNELS.map(x => `<option${x === ck.channel ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
            <div class="field"><label>銷售員</label><select class="sel" id="ck-staff">${['Alan', 'Bonnie', 'Carmen'].map(x => `<option${x === ck.staff ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
            ${c ? `<div class="small" style="grid-column:1/-1">${ic('users', 'width:14px;height:14px;vertical-align:-2px')} ${esc(c.name)} · 熟客，${s.invoices.filter(x => x.phone === c.phone).length} 次購買</div>` : ''}
          </div></div>
        </div>
        <div class="card" style="position:sticky;top:84px"><div class="hd"><h3>收款</h3></div><div class="bd stack">
          <div class="sum"><div class="r"><span class="muted">原價</span><span class="num">${hkd(list)}</span></div>${list !== total ? `<div class="r"><span class="muted">折扣</span><span class="num">-${hkd(list - total)}</span></div>` : ''}${deposit ? `<div class="r"><span class="muted">已付訂金</span><span class="num">-${hkd(deposit)}</span></div>` : ''}<div class="r" style="align-items:baseline"><span>應收</span><span class="big num">${hkd(due)}</span></div></div>
          ${below.length ? (isMgr() || ck.approved ? `<div class="note-ok">${ic('check')}低於底價，經理已批核。</div>` : `<div class="warn">${ic('alert')}<span>有 ${below.length} 件低於底價，需要經理批核。<button class="link" data-act="approve">輸入經理 PIN</button></span></div>`) : ''}
          <div class="pay-methods">${['轉數快', '現金', '信用卡', '支付寶HK', 'PayMe', '銀行轉帳'].map(p => `<button type="button" class="pm" data-act="add-pay" data-m="${p}">${p}</button>`).join('')}</div>
          <div>${pays.map((p, i) => `<div class="pay-row"><span style="font-weight:600">${p.method}</span><input class="inp num" data-pay="${i}" value="${p.amount}"><button class="btn sm ghost" data-act="rm-pay" data-i="${i}" aria-label="移除">${ic('x')}</button></div>`).join('')}</div>
          <div class="sum"><div class="r"><span class="muted">已收</span><span class="num">${hkd(paid)}</span></div><div class="r"><span class="muted">${remain > 0 ? '尚欠' : '找贖'}</span><span class="num" style="font-weight:700;color:${remain > 0 ? 'var(--red)' : 'var(--green)'}">${hkd(Math.abs(remain))}</span></div></div>
          <button class="btn green lg block" data-act="complete" ${!lines.length || remain > 0 || needApprove ? 'disabled' : ''}>${ic('printer')}完成收款並列印</button>
          <div class="small muted">一張單同時建立發票及收款紀錄；賣出的機即時喺網店落架。</div>
        </div></div>
      </div>`;
    const scan = $('#ck-scan', el);
    scan.focus();
    scan.addEventListener('keydown', e => { if (e.key === 'Enter') { const err = addToCart(scan.value.trim().toUpperCase()) || ''; if (err) toast(err); scan.value = ''; route(); } });
    el.addEventListener('change', e => {
      if (e.target.dataset.price) { const l = cart.find(x => x.code === e.target.dataset.price); if (l) l.price = +e.target.value || 0; ck.approved = false; route(); }
      if (e.target.dataset.pay != null) { pays[+e.target.dataset.pay].amount = +e.target.value || 0; route(); }
      if (e.target.id === 'ck-phone') { ck.phone = e.target.value; route(); }

      if (e.target.id === 'ck-staff') ck.staff = e.target.value;
    });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;

      if (a === 'pick' || a === 'scan-demo') { const code = a === 'pick' ? b.dataset.code : (picks[0] || {}).code; if (!code) return; const err = addToCart(code); if (err) toast(err); route(); return; }
      if (a === 'rm') { cart = cart.filter(l => l.code !== b.dataset.code); route(); return; }
      if (a === 'clear') { cart = []; pays = []; ck.phone = ''; ck.approved = false; route(); return; }
      if (a === 'add-pay') { pays.push({ method: b.dataset.m, amount: Math.max(0, remain) }); route(); return; }
      if (a === 'rm-pay') { pays.splice(+b.dataset.i, 1); route(); return; }
      if (a === 'approve') {
        const m = UI.modal({ title: '經理批核', width: 380, body: '<div class="field"><label style="font-weight:600">經理 PIN</label><input class="pm-in" id="pin" type="password" inputmode="numeric" style="height:40px;border:1px solid #d4d4d8;border-radius:8px;padding:0 10px;font-size:18px;letter-spacing:.3em;width:100%"><div style="font-size:12px;color:#71717a;margin-top:6px">示範 PIN：1234</div></div>', foot: '<button class="pm-btn" data-close>取消</button><button class="pm-btn primary" data-ok>批核</button>' });
        $('#pin', m.el).focus();
        $('[data-ok]', m.el).addEventListener('click', () => { if ($('#pin', m.el).value === '1234') { ck.approved = true; m.close(); route(); toast('經理已批核'); } else toast('PIN 唔正確'); });
        return;
      }
      if (a === 'complete') completeSale(lines, total, deposit);
    });
  };

  function completeSale(lines, total, deposit) {
    const s = S();
    const phone = fmtPhone(ck.phone);
    const name = phone ? (PM.customer(phone) || PM.upsertCustomer(phone, '新客戶')).name : '散客';
    const no = PM.nextNo('inv');
    const paid = pays.reduce((a, p) => a + (+p.amount || 0), 0);
    const change = Math.max(0, paid - (total - deposit));
    const inv = { no, date: TODAY, phone, name, channel: ck.channel, staff: ck.staff, lines: lines.map(l => ({ code: l.code, name: unitTitle(l.u), imei: l.u.imei || l.u.serial, price: l.price, grade: l.u.grade })), amount: total, received: total, note: deposit ? `已扣訂金 ${hkd(deposit)}` : '' };
    s.invoices.unshift(inv);
    // The books record cash net of change; the printed receipt shows cash tendered and change given.
    const payments = [];
    if (deposit) payments.push({ method: '已付訂金', amount: deposit });
    pays.forEach(p => {
      const tendered = +p.amount || 0;
      const amt = p.method === '現金' ? Math.max(0, tendered - change) : tendered;
      if (amt > 0) s.receipts.unshift({ no: PM.nextNo('rv'), date: TODAY, phone, name, method: p.method, amount: amt, inv: no });
      if (tendered > 0) payments.push({ method: p.method, amount: tendered });
    });
    lines.forEach(l => {
      const u = l.u;
      u.status = 'sold';
      u.sold = { date: TODAY, to: phone, channel: ck.channel, pay: pays.map(p => p.method).join('+'), price: l.price, staff: ck.staff, inv: no };
      u.reserved = null;
      u.events.push({ d: TODAY, type: '售出', note: `${ck.channel}，${pays.map(p => p.method).join('+')}，${hkd(l.price)}，發票 ${no}`, by: ck.staff });
    });
    commit();
    const receipt = UI.receiptSale({ no, date: UI.now(), staff: ck.staff, channel: ck.channel, customer: phone ? { name, phone } : null, lines: lines.map(l => ({ title: unitTitle(l.u), code: l.code, grade: l.u.grade, battery: l.u.battery, imei: l.u.imei || l.u.serial, price: l.price })), payments: change ? payments.concat([{ method: '找贖', amount: change }]) : payments, total });
    cart = []; pays = []; ck.phone = ''; ck.approved = false; ck.channel = '門市';
    route();
    UI.printPreview(receipt, { title: `完成 · ${no}`, hint: '已建立發票及收款紀錄，網店已即時落架。一按即印，唔使揀打印機。' });
  }

      if (a === 'vis') { const id = b.dataset.id; cms.hidden = cms.hidden.includes(id) ? cms.hidden.filter(x => x !== id) : cms.hidden.concat(id); commit(); route(); toast(cms.hidden.includes(id) ? '已隱藏：' + BLOCKS[id][0] : '已顯示：' + BLOCKS[id][0]); return; }
      if (a === 'up' || a === 'down') { const i = +b.dataset.i; const j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= cms.blocks.length) return; const t = cms.blocks[i]; cms.blocks[i] = cms.blocks[j]; cms.blocks[j] = t; commit(); route(); return; }
      if (a === 'publish') { commit(); reloadFrame(); toast('已發佈，網店已更新'); return; }
      if (a === 'page') { cmsPage = b.dataset.id; route(); return; }
      if (a === 'new-page') { const p = { slug: 'new-page-' + (cms.pages.length + 1), title: '新頁面', status: '草稿', updated: TODAY, body: '' }; cms.pages.push(p); cmsPage = p.slug; commit(); route(); return; }
      if (a === 'img') { toast('示範：插入圖片'); return; }
      if (a === 'save-page' || a === 'draft') {
        const pg = cms.pages.find(p => p.slug === cmsPage) || cms.pages[0];
        pg.title = $('#pg-title', el).value; pg.slug = $('#pg-slug', el).value || pg.slug; pg.body = $('#pg-body', el).innerText.trim(); pg.updated = TODAY; pg.status = a === 'draft' ? '草稿' : '已發佈';
        cmsPage = pg.slug; commit(); route(); toast(a === 'draft' ? '已存為草稿' : '已發佈，網店已更新'); return;
      }
      if (a === 'banner-on') { const bn = cms.banners[+b.dataset.i]; bn.on = !bn.on; commit(); route(); return; }
      if (a === 'new-banner') { cms.banners.push({ id: 'b' + (cms.banners.length + 1), title: '新推廣', from: TODAY, to: '2026-12-31', on: false }); commit(); route(); return; }
      if (a === 'save-banners') { commit(); toast('已發佈，網店已更新'); return; }
      if (a === 'save-matrix') { $$('input[data-k]', el).forEach(i => { const v = +i.value; const [mid, cap] = i.dataset.k.split('|'); if (v && v !== PM.r10(modelOf(mid).base[cap] * 0.7)) s.matrix[i.dataset.k] = v; else delete s.matrix[i.dataset.k]; }); commit(); route(); toast('已儲存，櫃面及網店報價即時更新'); return; }
      if (a === 'save-rp') { $$('input[data-rp]', el).forEach(i => { s.repairPrices[+i.dataset.rp][2] = +i.value || 0; }); commit(); toast('已儲存，網店已更新'); return; }
      if (a === 'save-store') { commit(); toast('已儲存'); }
    });
  };

  // ---------------------------------------------------------------- start
  window.addEventListener('hashchange', () => { fallback = null; route(); });
  store.on(() => { if (!muted && !document.querySelector('.pm-overlay')) route(); });
  route();
})();

</script>
</body>
